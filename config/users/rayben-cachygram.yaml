# rayben on cachygram. Everything that is not tied to this machine lives in
# users/common/rayben-laptop.yaml, included below; this file is only the
# per-machine glue: the LG keyboard-backlight bind and this host's DMS settings.

laptop: !include "./common/rayben-laptop.yaml"

files:
  # LG Gram keyboard backlight key (hardware side in hosts/cachygram.yaml)
  - source: ${config_root}/files/niri/lg-gram-binds.kdl
    target: ~/.config/niri/lg-gram-binds.kdl
    symlink: true

  - content: |

      // added by stay
      include "rules.kdl"
      include "spawn.kdl"
      include "binds.kdl"
      include "lg-gram-binds.kdl"
    target: ~/.config/niri/config.kdl
    add: true
    depends:
      - commands: [install dms] # its installer replaces both files

  # ── DMS settings ──
  # Symlinked into the repo so every change made in the DMS settings UI lands
  # in files/dms/settings.cachygram.json, ready to commit (DMS saves through
  # the link and leaves it in place). This replaced a json: entry that only
  # pinned a few keys, so a UI change anywhere else was lost on reinstall.
  - source: ${config_root}/files/dms/settings.cachygram.json
    target: ~/.config/dms/settings.json
    symlink: true
    depends:
      - commands: [install dms]
