# The basis for this config is cachy-os with no desktop installed.
# The default Niri install contains a different shell that is difficult to remove.

variables:
  home:
    sedanos: /home/distrobox/sedanos
    visionet: /home/distrobox/visionet
    stoneridge: /home/distrobox/stoneridge
    motion: /home/distrobox/${secrets.privileged.c4}

secrets:
  privileged:
    c1: !encrypted 5Mc1+tOjH40ekJkE/aVO659O18nBeShohsZZ5WX+VLXTn8LszFpmgxF26msJmc7inc9r
    c2: !encrypted 6NsavEkJk0W3vGS8NE8PMXNCbQSEtPZ2ONLp2R6j95QsBrPBpc6apzcVwh7aPdaiM1lTXA==
    c3: !encrypted lomKP5luiYA2NkLvgInedS8TcKY+XYTo9G0I0sZXjMn97AjXTyDUiflh93EUoJ5acTdOlhhb
    c4: !encrypted 5ZdMUY/om/KEfDzZD9SyihpLyKJwdttZ+9HnW7pHE7cg0D8qtdTZ0yRS/sLSC4LK5x4=
  ssh:
    id_ed25519: !encrypted 
    id_rsa: !encrypted 
    config: !encrypted 
  databricks:
    client_secret: !encrypted CLmAj/yRvCT61C9Ze3lZu/cbnVrFmnMwE7e2KkNNVKIRxpRHXNfKJYrT1cFiMoxKG+jwfqyWnBUY57TFwn5M1ahHYEhv7q+k9s3KBtkX2iSKehtu
    production_pat: !encrypted c4gdGfaIHqUuh857LIEpP/2PjNt4k1xI5CNtjRgbeqdCFSrkz8d48MqNdfWplmsZF5KiaClhxpbuNKcIMnRne1l3wPzVW0NdakYtUoBLSjpS7w==
    test_client_secret: !encrypted 3Qlb79G+Nul/5iuBKNUFUu6XMAFRBUwERcBmFnq/AE7OhjY+R6t7lw+AQEhENW7mRDkyTWAYb0eJSS12a1s34Gl4LSgNdugtKZoc8XZPctQ=
    prod_client_secret: !encrypted Ao2yEY+mcAJsJgZwNPthyr7op3mM0sA5M4vmOJo5FV4a/HZXJ0UuRr12/7q3purYMVZwZFiJMNHZ6r6+xyLBgEcfzs822D2nhQsW13O3oUk=
  tailscale_key: !encrypted CFh3d0YEkLYvW/k184L8E7E2QaIuVoFHg2h3vFbHyaCt+lUDHyuRFGHzOGfXSEbyCg7ngd7epYNV4lgMAUTbn+odFY72MP/eXAOiBG2Jagfm5QD9OG2UNPVQAUz8rCthVrOGeYBuAHu8eg==

packages:
  - ttf-mona-sans
  - tailscale
  - zoxide
  - fzf
  - visual-studio-code-bin
  - go
  - entr # for monitoring file events for diff
  - gron # same
  - firefox
  - gnome-calculator
  - onlyoffice-bin
  - stremio
  - libappindicator
  - dropbox
  - nautilus-dropbox
  - distrobox
  - discord
  - zen-browser
  - docker-compose
  - freerdp
  - aria2
  - grim
  - slurp
  - wayfreeze
  - satty
  - psmisc # killall, used by screenshot.sh
  - lib32-fontconfig # fc-cache-32, used by the windows fonts command
  # Pin the 32-bit GL/Vulkan providers before the gaming meta: left to pick,
  # --noconfirm takes lib32-mesa-git, which conflicts with lib32-opencl-mesa.
  - lib32-mesa
  - lib32-vulkan-intel
  - cachyos-gaming-meta
  # Needs zlib-ng-compat, which conflicts with zlib; --noconfirm answers the
  # removal prompt "no", so commands/zlib-ng-compat swaps it in first.
  - package: cachyos-gaming-applications
    depends:
      - commands: [zlib-ng-compat]
  - 7zip
  - spotify-launcher
  - claude-desktop
  - flatpak
  - jq # verterm dropdown scripts
  - attr # getfattr/setfattr, used by dropbox-exclude.sh
  - python # dropbox-monitor
  - libnotify # notify-send, used by dropbox-monitor alerts
  - xwayland-satellite # niri starts it on demand for X11 apps
  - noto-fonts-emoji
  - noto-fonts-cjk
  - cantarell-fonts
  - ttf-opensans
  - awesome-terminal-fonts
  - btop
  - pavucontrol # floated by a window rule in files/niri/rules.kdl

services:
  - service: gcr-ssh-agent.socket
    user: true
  - service: tailscaled.service
  - service: dropbox-monitor.timer
    user: true
    depends:
      - packages: [dropbox]
      - files:
          - ~/.config/systemd/user/dropbox-monitor.timer
          - ~/.config/systemd/user/dropbox-monitor.service
          - ~/.local/bin/dropbox-monitor
  - service: bt-headset-watchdog.service
    user: true
    depends:
      - files:
          - ~/.config/systemd/user/bt-headset-watchdog.service
          - ~/.local/bin/bt-headset-watchdog
  # Nightly backup of Life's data to orohost.
  - service: life-backup.timer
    user: true
    depends:
      - files:
          - ~/.config/systemd/user/life-backup.service
          - ~/.config/systemd/user/life-backup.timer

files:
  # Own drop-in rather than editing the installer's sudoers.d file, which a
  # reinstall may name differently or not create at all.
  - content: |
      # Managed by stay-go.
      %wheel ALL=(ALL:ALL) NOPASSWD: ALL
    target: /etc/sudoers.d/20-wheel-nopasswd
    mode: "0440"
    sudo: true

  # SSH keys and config (written first; dotfiles clone depends on them)
  - source: ${secrets.ssh.id_ed25519}
    target: "~/.ssh/id_ed25519"
    mode: "0600"

  - source: ${secrets.ssh.id_rsa}
    target: "~/.ssh/id_rsa"
    mode: "0600"

  - source: ${secrets.ssh.config}
    target: "~/.ssh/config"

  # ── Folder links into ~ ──────────────────────────────────────────────────
  # ~/code and ~/work are the stable paths everything else refers to, so a
  # Dropbox reorganisation only changes these two sources.
  - source: ~/Dropbox/Ray/Code
    target: ~/code
    symlink: true

  - source: ~/Dropbox/Ray/Work
    target: ~/work
    symlink: true

  # Life runs as a user service straight from its repo.
  - source: ~/code/life/systemd/life.service
    target: ~/.config/systemd/user/life.service
    symlink: true

  - source: ~/code/life/systemd/life.service
    target: ~/.config/systemd/user/graphical-session.target.wants/life.service
    symlink: true

  - source: ~/code/life/systemd/life-backup.service
    target: ~/.config/systemd/user/life-backup.service
    symlink: true

  - source: ~/code/life/systemd/life-backup.timer
    target: ~/.config/systemd/user/life-backup.timer
    symlink: true

  # mudengine loads the private konami-engine extension from its build output.
  - source: ~/code/konami-engine/dist
    target: ~/.config/mudengine/extensions/konami
    symlink: true

  # ── SSH passphrases, typed once ──────────────────────────────────────────
  # gcr-ssh-agent (gcr-4's replacement for the ssh component gnome-keyring
  # dropped, enabled as gcr-ssh-agent.socket above) is what answers on
  # $SSH_AUTH_SOCK. On the first agent request it scans ~/.ssh for *.pub and
  # runs ssh-add over each match with /usr/lib/gcr4-ssh-askpass: the passphrase
  # is looked up in the Secret Service first, and only on a miss does it
  # prompt — with an "Automatically unlock this key whenever I'm logged in"
  # checkbox that writes the passphrase back into the default keyring under
  # "ssh-store:<path>". Tick it once and the key loads silently from then on.
  #
  # The two entries below are what that mechanism was missing here.

  # Public halves of the keys. The secrets above ship only the private halves,
  # so ~/.ssh held no *.pub at all: gcr-ssh-agent preloaded nothing and
  # `ssh-add -l` came back empty. Their absence also defeats the github.com
  # block in ~/.ssh/config — under `IdentitiesOnly yes` ssh matches agent keys
  # against the public half of each IdentityFile, and with no .pub on disk it
  # has to decrypt the private key to derive it, which is a passphrase prompt
  # on every connection even when the agent already holds the key. Public by
  # definition: these are derived from the encrypted secrets above, nothing more.
  - content: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKBoMkTnztfde1TGffhY4EBd4fYlPCSU3Ltcy//4abR3 raymond.bennett@gmail.com
    target: ~/.ssh/id_ed25519.pub
    mode: "0644"

  - content: |
      ssh-rsa  raymond.bennett@gmail.com
    target: ~/.ssh/id_rsa.pub
    mode: "0644"

  # Point the default keyring at Login. gcr-ssh-agent stores through libsecret
  # with a NULL collection, i.e. into whatever this alias file names. This box
  # carries two password-protected keyrings — "Login" (login.keyring) and a
  # separately created "Default keyring" — and the alias named the latter, so a
  # remembered passphrase would land in a keyring nothing opens automatically.
  # Only Login is free: /etc/pam.d/sddm runs pam_gnome_keyring with auto_start,
  # handing the daemon the password typed at the greeter and unlocking
  # login.keyring with it. Anything in the other keyring costs one unlock prompt
  # per session, which is exactly the prompt this change exists to remove.
  #
  # Only new secrets follow the alias; items already in "Default keyring" stay
  # put and keep resolving while it is unlocked. Written with |- so the file is
  # the bare keyring identifier with no trailing newline, byte-for-byte what
  # gnome-keyring writes here itself.
  - content: |-
      login
    target: ~/.local/share/keyrings/default

  # Niri compositor config
  - source: ${config_root}/files/niri/screenshot.sh
    target: ~/.config/niri/screenshot.sh
    symlink: true
    mode: "+x"

  - source: ${config_root}/files/niri/verterm-dropdown-toggle.sh
    target: ~/.config/niri/verterm-dropdown-toggle.sh
    symlink: true
    mode: "+x"
    depends:
      - packages: [jq]

  - source: ${config_root}/files/niri/verterm-dropdown-autohide.sh
    target: ~/.config/niri/verterm-dropdown-autohide.sh
    symlink: true
    mode: "+x"
    depends:
      - packages: [jq]

  - source: ${config_root}/files/niri/rules.kdl
    target: ~/.config/niri/rules.kdl
    symlink: true

  - source: ${config_root}/files/niri/spawn.kdl
    target: ~/.config/niri/spawn.kdl
    symlink: true

  - source: ${config_root}/files/niri/binds.kdl
    target: ~/.config/niri/binds.kdl
    symlink: true

  # LG Gram keyboard backlight key (hardware side in hosts/cachygram.yaml)
  - source: ${config_root}/files/niri/lg-gram-binds.kdl
    target: ~/.config/niri/lg-gram-binds.kdl
    symlink: true

  - content: |

      // added by stay
      include "rules.kdl"
      include "spawn.kdl"
      include "binds.kdl"
      include "lg-gram-binds.kdl"
    target: ~/.config/niri/config.kdl
    add: true
    depends:
      - commands: [install dms] # its installer replaces both files

  - content: |
      
      # stay
      copy-on-select = true
    target: ~/.config/ghostty/config
    add: true
    depends:
      - commands: [install dms] # its installer replaces both files

  # Application config files
  - source: ${config_root}/files/config/electron-flags.conf
    target: ~/.config/electron-flags.conf
    symlink: true

  - content: |
      [prod-man]
      host = https://adb-7405608649113470.10.azuredatabricks.net
      auth_type = azure-client-secret
      azure_tenant_id = 10895ab2-90e3-4778-a157-855870900fb7
      azure_client_id = ca971a3e-1cc2-41b4-a76c-db4bf4c9494d
      azure_client_secret = ${secrets.databricks.client_secret}

      [test-man]
      host = https://adb-7405619906526803.3.azuredatabricks.net
      auth_type = azure-client-secret
      azure_tenant_id = 10895ab2-90e3-4778-a157-855870900fb7
      azure_client_id = ca971a3e-1cc2-41b4-a76c-db4bf4c9494d
      azure_client_secret = ${secrets.databricks.client_secret}
      
      [test]
      host = https://adb-1871084061330888.8.azuredatabricks.net
      client_id = a667e418-f433-4dfa-a2f3-33132684eb93
      client_secret = ${secrets.databricks.test_client_secret}
    target: ~/.databrickscfg
    mode: "0600"

  # The sedanos box's own Databricks config: the profiles above plus [prod]
  # (service principal) and the two U2M browser-login profiles. U2M tokens are
  # not in this file -- auth_storage = secure keeps them in the GNOME keyring.
  - content: |
      ; The profile defined in the DEFAULT section is to be used as a fallback when no profile is explicitly specified.
      [DEFAULT]

      [prod-man]
      host                = https://adb-7405608649113470.10.azuredatabricks.net
      auth_type           = azure-client-secret
      azure_tenant_id     = 10895ab2-90e3-4778-a157-855870900fb7
      azure_client_id     = ca971a3e-1cc2-41b4-a76c-db4bf4c9494d
      azure_client_secret = ${secrets.databricks.client_secret}

      [test-man]
      host                = https://adb-7405619906526803.3.azuredatabricks.net/
      auth_type           = azure-client-secret
      azure_tenant_id     = 10895ab2-90e3-4778-a157-855870900fb7
      azure_client_id     = ca971a3e-1cc2-41b4-a76c-db4bf4c9494d
      azure_client_secret = ${secrets.databricks.client_secret}

      [test]
      host          = https://adb-1871084061330888.8.azuredatabricks.net
      auth_type     = oauth-m2m
      client_id     = a667e418-f433-4dfa-a2f3-33132684eb93
      client_secret = ${secrets.databricks.test_client_secret}

      [prod]
      host          = https://adb-3748765281244117.17.azuredatabricks.net
      client_id     = 69294183-8bc8-46a7-9d22-2cf9335bf0e2
      client_secret = ${secrets.databricks.prod_client_secret}
      auth_type     = oauth-m2m

      [prod-u2m]
      host         = https://adb-3748765281244117.17.azuredatabricks.net
      account_id   = 6113a58e-f9c6-4565-8ef8-3751321f8b13
      workspace_id = 3748765281244117
      auth_type    = databricks-cli

      [__settings__]
      auth_storage = secure

      [dev-u2m]
      host         = https://adb-7405606637327328.8.azuredatabricks.net
      account_id   = 6113a58e-f9c6-4565-8ef8-3751321f8b13
      workspace_id = 7405606637327328
      auth_type    = databricks-cli
    target: ${home.sedanos}/.databrickscfg
    mode: "0600"
    depends:
      - distrobox: [sedanos] # creates and chowns the box home under /home/distrobox

  # Fish shell functions
  - content: |
      function watchdiff
        set file $argv[1]
        set backup ".$file.bak"

        # Create the initial backup if it doesn't exist
        cp $file $backup

        echo "Watching $file... (Ctrl+C to stop)"

        # We use -p to postpone the first run until a change actually occurs
        echo $file | entr -s "diff -u $backup $file; cp $file $backup"
      end
    target: ~/.config/fish/functions/watchdiff.fish
    mode: "+x"
    depends:
      - packages: [entr]

  - content: |
      function watchjson
        set file $argv[1]
        set old_flat "/tmp/$file.old.txt"
        set new_flat "/tmp/$file.new.txt"

        # Initial state
        gron $file > $old_flat

        echo "Watching JSON paths in $file... (Ctrl+C to stop)"

        # Watch the file, flatten it, diff it, then update the "old" snapshot
        echo $file | entr -s "gron $file > $new_flat; diff -u $old_flat $new_flat | grep '^[-+][^---]'; mv $new_flat $old_flat"
      end
    target: ~/.config/fish/functions/watchjson.fish
    mode: "+x"
    depends:
      - packages: [gron]

  # ── Dropbox sync monitor ──
  # Oct 2026: the daemon sat frozen for 8 days (alive, 2m40s CPU in 9 days) and
  # nothing noticed. Every 5 min the monitor checks the process, that its
  # command socket answers, that its status isn't an error / stuck, and that an
  # hourly canary file in ~/Dropbox/.dropbox-monitor/ actually syncs (rules in
  # the script). A failure lasting 10 min sends a critical notification (at most
  # every 30 min until fixed) and leaves an alert for SSH logins.
  # Copied, not symlinked: the monitor must not live in the thing it watches.
  - source: ${config_root}/files/dropbox-monitor.py
    target: ~/.local/bin/dropbox-monitor
    mode: "0755"
    depends:
      - packages: [python, libnotify]

  - content: |
      [Unit]
      Description=Check that Dropbox is running and syncing

      [Service]
      Type=oneshot
      ExecStart=%h/.local/bin/dropbox-monitor
      TimeoutStartSec=2min
    target: ~/.config/systemd/user/dropbox-monitor.service

  - content: |
      [Unit]
      Description=Check Dropbox sync every 5 minutes

      [Timer]
      OnStartupSec=5min
      OnUnitActiveSec=5min

      [Install]
      WantedBy=timers.target
    target: ~/.config/systemd/user/dropbox-monitor.timer

  # On SSH login, live-check Dropbox and print a banner if it isn't syncing.
  # Live rather than just reading the timer's alert: with no graphical session
  # neither Dropbox nor the timer may be running at all.
  - content: |
      if status is-interactive; and set -q SSH_CONNECTION; and test -x ~/.local/bin/dropbox-monitor
          ~/.local/bin/dropbox-monitor --motd
      end
    target: ~/.config/fish/conf.d/dropbox-monitor.fish

  # ── Poly V4320 headset watchdog ──
  # The headset's call audio dies on this laptop's Intel Bluetooth and used to
  # need a power cycle. The watchdog reconnects it (or resets a crashed chip)
  # when PipeWire reports the link failed. Script header has the details; the
  # host layer keeps the chip out of USB autosuspend.
  - source: ${config_root}/files/bt-headset-watchdog.sh
    target: ~/.local/bin/bt-headset-watchdog
    mode: "0755"
    depends:
      - packages: [jq, libnotify]

  - content: |
      [Unit]
      Description=Reconnect the Bluetooth headset when its audio link fails
      After=pipewire.service wireplumber.service

      [Service]
      ExecStart=%h/.local/bin/bt-headset-watchdog 38:5C:76:C3:D5:20
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=default.target
    target: ~/.config/systemd/user/bt-headset-watchdog.service

ghostty: !include "./commands/ghostty.yaml"

commands:
  # --ask=4 answers yes to pacman's "Remove zlib?" conflict question, which
  # --noconfirm alone answers no.
  - name: zlib-ng-compat
    command: pacman -Qq zlib-ng-compat >/dev/null 2>&1 || pacman -S --noconfirm --ask=4 zlib-ng-compat
    check: pacman -Qq zlib-ng-compat >/dev/null 2>&1
    sudo: true

  - name: git config
    command: |
      git config --global user.name "Raymond Bennett"
      git config --global user.email "raymond.bennett@gmail.com"
    depends:
      - packages: [git]
    rollback: |
      git config --global --unset user.name
      git config --global --unset user.email

  - name: windows fonts
    command: |
      pushd ~/Downloads/isos
      7z e Win11_25H2_English_x64_v2.iso sources/install.wim -aoa
      7z e install.wim 1/Windows/{Fonts/"*".{ttf,ttc},System32/Licenses/neutral/"*"/"*"/license.rtf} -o/tmp/fonts/ -aoa
      mkdir -p /usr/local/share/fonts/WindowsFonts
      cp /tmp/fonts/*.ttf /usr/local/share/fonts/WindowsFonts/
      chmod -R 644 /usr/local/share/fonts/WindowsFonts/*
      fc-cache --force
      fc-cache-32 --force
    sudo: true
    depends:
      - packages: [7zip, lib32-fontconfig] # lib32-fontconfig: fc-cache-32
      - files: [~/Downloads/isos/Win11_25H2_English_x64_v2.iso]
      - folders: ["!/usr/local/share/fonts/WindowsFonts"]
      
  - name: tailscale
    command: |
      tailscale up --authkey=${secrets.tailscale_key} --operator=$USER
      tailscale configure systray --enable-startup=systemd
      tailscale set --operator=$USER
    sudo: true
    depends:
      - services: [tailscaled.service]
      - packages: [tailscale]

  # ── Keep regenerable folders out of Dropbox sync ──
  # Marks node_modules, __pycache__, venvs, .claude/worktrees, git-ignored
  # build output and the like with user.com.dropbox.ignored so new projects
  # never churn (rules in the script). `check` re-scans on every stay-go run,
  # so the command re-runs only when a new folder needs excluding.
  # Opt a folder out with an empty .dropbox-keep file inside it.
  - name: dropbox-exclude-regenerable
    command: bash ${config_root}/scripts/dropbox-exclude.sh
    check: bash ${config_root}/scripts/dropbox-exclude.sh --check
    depends:
      - packages: [dropbox, attr]

  # Firefox user.js. A command rather than a files: entry because the profile
  # directory has to be read from profiles.ini when it runs, not when the
  # config loads (before Firefox has created a profile on a fresh machine).
  # The check re-runs it when the profile's copy drifts from the repo's.
  - name: firefox user.js
    command: bash ${config_root}/scripts/firefox-user-js.sh
    check: bash ${config_root}/scripts/firefox-user-js.sh --check
    depends:
      - packages: [firefox]

scripts:
  - script: ${config_root}/scripts/configure-zoxide.sh
    depends:
      - packages: [zoxide, fzf]

flatpak:
  remotes:
    - name: flathub
      url: https://dl.flathub.org/repo/flathub.flatpakrepo

distrobox:
  - name: sedanos
    image: docker.io/cachyos/cachyos-v3:latest
    home: ${home.sedanos}
    home_sudo: true
    extends: ${config_root}/users/distrobox-base.yaml
    depends: # docker must be running and rayben in its group (extends doesn't merge depends)
      - services: [docker]
      - users: [rayben]
    exports:
      - code
      - cursor
      - StorageExplorer
      - claude
    packages:
      - visual-studio-code-bin
      - cursor-bin
      - azure-cli
      - storageexplorer
      - jdk-openjdk
      - azure-cli
      - pulumi
      - nodejs
      - npm
      - opentofu
      - claude-desktop
      - databricks-cli-bin
      - graphify-bin
      - ninjarmm-ncplayer
      - ruff
      - jq
      - zoxide
    commands:
      # The CLI used to come from Databricks' curl installer, which drops a
      # binary in /usr/local/bin; that sits ahead of /usr/bin on PATH and would
      # shadow databricks-cli-bin. No-op once it is gone.
      - name: retire curl databricks cli
        command: rm -f /usr/local/bin/databricks
        sudo: true
        depends:
          - packages: [databricks-cli-bin]
      - name: Install uv
        command: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: azure cli extensions
        command: |
          for ext in azure-devops containerapp databricks datafactory scheduled-query; do
            az extension add --upgrade --name $ext
          done
        depends:
          - packages: [azure-cli]
      - name: link dev folder
        command: |
          ln -sfn /home/${env:USER}/work/sedanos/development ${home.sedanos}/development
        depends:
          - folders: ["/home/${env:USER}/work/sedanos/development"]
      - name: fish config
        command: |
          curl https://raw.githubusercontent.com/oh-my-fish/oh-my-fish/master/bin/install | fish

  - name: motion
    image: docker.io/cachyos/cachyos-v3:latest
    home: ${home.motion}
    home_sudo: true
    extends: ${config_root}/users/distrobox-base.yaml
    depends: # docker must be running and rayben in its group (extends doesn't merge depends)
      - services: [docker]
      - users: [rayben]

  - name: stoneridge
    image: docker.io/cachyos/cachyos-v3:latest
    home: ${home.stoneridge}
    home_sudo: true
    extends: ${config_root}/users/distrobox-base.yaml
    depends: # docker must be running and rayben in its group (extends doesn't merge depends)
      - services: [docker]
      - users: [rayben]


json:
  - file: ~/.config/DankMaterialShell/settings.json
    depends:
      - commands: [install dms]
    json:
      use24HourClock: false
      showSeconds: true
      clockDateFormat: "dddd, MMMM d"
      lockDateFormat: "dddd, MMMM d"
      useFahrenheit: true
      useAutoLocation: true
      animationSpeed: 2
      cornerRadius: 6
      fontFamily: "LucidaProgrammer Nerd Font Mono"
      monoFontFamily: "LucidaProgrammer Nerd Font Mono"
      showWorkspaceIndex: true
      workspaceDragReorder: false
      workspaceFocusedBorderEnabled: true
      blurForegroundLayers: true
      barConfigs[0]:
        openOnOverview: true
        borderEnabled: true
        borderOpacity: 0.5
        squareCorners: true
        maximizeWidgetText: true
        maximizeWidgetIcons: true
        widgetOutlineEnabled: false
        widgetOutlineOpacity: 0.5
        leftWidgets:
          - "workspaceSwitcher"
          - "focusedWindow"
          - {}
        centerWidgets:
          - "clock"
          - "weather"
          - {}
      cursorSettings.size: 28
