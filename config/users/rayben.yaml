# The basis for this config is cachy-os with no desktop installed.
# The default Niri install contains a different shell that is difficult to remove.

packages:
  - zoxide
  - fzf
  - cursor-bin
  - visual-studio-code-bin
  - go
  - entr # for monitoring file events for diff
  - gron # same
  - firefox
  - gnome-calculator
  - onlyoffice-bin
  - stremio
  - libappindicator
  - dropbox
  - distrobox
  - discord
  - zen-browser

scripts:
  - script: ${config_root}/scripts/configure-zoxide.sh
    depends:
      - packages: [zoxide, fzf]
      
commands:
  - name: git config
    command: |
      git config --global user.name "Raymond Bennett"
      git config --global user.email "raymond.bennett@gmail.com"
    depends:
      - packages: [git]
    rollback: |
      git config --global --unset user.name
      git config --global --unset user.email
  - name: wheel no password
    command: |
      sed -i 's/%wheel ALL=(ALL) ALL/%wheel ALL=(ALL) NOPASSWD: ALL/' /etc/sudoers.d/10-installer
    sudo: true

secrets:
  ssh_id_ed25519: !encrypted 
  ssh_id_rsa: !encrypted 
  ssh_config: !encrypted 

files:
  - source: ${secrets.ssh_id_ed25519}
    target: "~/.ssh/id_ed25519"
    mode: "0600"

  - source: ${secrets.ssh_id_rsa}
    target: "~/.ssh/id_rsa"
    mode: "0600"

  - source: ${secrets.ssh_config}
    target: "~/.ssh/config"

  - source: ${config_root}/files/niri/screenshot.sh
    target: ~/.config/niri/screenshot.sh
    symlink: true
    mode: "+x"
    
  - source: ${config_root}/files/niri/rules.kdl
    target: ~/.config/niri/rules.kdl
    symlink: true
    
  - source: ${config_root}/files/niri/spawn.kdl
    target: ~/.config/niri/spawn.kdl
    symlink: true
    
  - source: ${config_root}/files/config/electron-flags.conf
    target: ~/.config/electron-flags.conf
    symlink: true

  - source: ${config_root}/files/config/microsoft-edge-stable-flags.conf
    target: ~/.config/microsoft-edge-stable-flags.conf
    symlink: true
    
  - source: git@github.com:rayzorben/dotfiles.git
    target: ~/dotfiles
    ssh_key: ["~/.ssh/id_ed25519"]
    depends:
      - file: ["~/.ssh/id_ed25519"]

  - source: ${config_root}/files/config/firefox-user.js
    target: '~/.config/mozilla/firefox/$(awk -F= "/^\[Install/ {getline; print \$2}" ~/.config/mozilla/firefox/profiles.ini)/user.js'
    depends:
        - packages: ['firefox']

  - content: |
      function watchdiff
        set file $argv[1]
        set backup ".$file.bak"
        
        # Create the initial backup if it doesn't exist
        cp $file $backup
        
        echo "Watching $file... (Ctrl+C to stop)"
        
        # We use -p to postpone the first run until a change actually occurs
        echo $file | entr -s "diff -u $backup $file; cp $file $backup"
      end
    target: ~/.config/fish/functions/watchdiff.fish
    mode: "+x"
    depends: 
      - packages: [entr]
  - content: |
      function watchjson
        set file $argv[1]
        set old_flat "/tmp/$file.old.txt"
        set new_flat "/tmp/$file.new.txt"

        # Initial state
        gron $file > $old_flat

        echo "Watching JSON paths in $file... (Ctrl+C to stop)"

        # Watch the file, flatten it, diff it, then update the "old" snapshot
        echo $file | entr -s "gron $file > $new_flat; diff -u $old_flat $new_flat | grep '^[-+][^---]'; mv $new_flat $old_flat"
      end
    target: ~/.config/fish/functions/watchjson.fish
    mode: "+x"
    depends:
      - packages: [gron]
  - content: |

      // added by stay
      include "rules.kdl"
      include "spawn.kdl"
    target: ~/.config/niri/config.kdl
    add: true

containers:
  - name: redis
    image: redis:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - "${config_root}/data/redis:/data"
    depends:
      - services: [docker]

ghostty: !include "./commands/ghostty.yaml"
      
distrobox:
  - name: sedanos
    image: docker.io/cachyos/cachyos-v3:latest
    home: /home/distrobox/sedanos
    home_sudo: true
    exports:
      - microsoft-edge-stable
      - code
      - cursor
      - StorageExplorer

    packages:
      - paru
      - microsoft-edge-stable-bin
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-gnome
      - visual-studio-code-bin
      - cursor-bin
      - azure-cli
      - storageexplorer
      - jdk-openjdk
      - pulumi

    commands:
      - name: Install Databricks CLI
        command: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        sudo: true
      - name: Install uv
        command: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

json:
  - file: ~/.config/DankMaterialShell/settings.json
    json:
      use24HourClock: false
      showSeconds: true
      clockDateFormat: "dddd, MMMM d"
      lockDateFormat: "dddd, MMMM d"
      useFahrenheit: true
      useAutoLocation: true
      animationSpeed: 2
      cornerRadius: 6
      fontFamily: "LucidaProgrammer Nerd Font Mono"
      monoFontFamily: "LucidaProgrammer Nerd Font Mono"
      showWorkspaceIndex: true
      workspaceDragReorder: false
      workspaceFocusedBorderEnabled: true
      barConfigs[0]:
        openOnOverview: true
        borderEnabled: true
        borderOpacity: 0.5
        squareCorners: true
        maximizeWidgetText: true
        maximizeWidgetIcons: true
        widgetOutlineEnabled: false
        widgetOutlineOpacity: 0.5
        leftWidgets:
          - "workspaceSwitcher"
          - "focusedWindow"
          - {}
      cursorSettings.size: 28
      
