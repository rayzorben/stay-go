# The basis for this config is cachy-os with no desktop installed.
# The default Niri install contains a different shell that is difficult to remove.

secrets:
  code:
    pass: !encrypted K29UUzqJb/CC7gPPSjA2BkuMSNGrZvNk4TgSSYqhtjuNjXxm2Dgpa71tj6lG/PHM2BzXRdEBAQ==
    proxy_domain: !encrypted mA9JKVZRVX4GVhSlrIHOY7HfgbsWCU+n2ReV8dA7lyX9MFihbylLWDdLZilqhc2EzWbWlWCFMzjoE/TTY/XGuw==
  ssh:
    id_ed25519: !encrypted 
    id_rsa: !encrypted 
    config: !encrypted 
  tailscale_key: !encrypted /MmhlkwH/6N6CSpTaBF20RkArtTJPIEBjOljykiYBwyZmH6zVCMabXDSCJL6yZDqaQuvPlfRiis+SZiDSXWIYqPtQQUBIkh95aGeuIElJeglr85sMR0oTPl5i+dwPfGD9fUgJmux6rnVhw==

packages:
  - ttf-mona-sans
  - tailscale
  - zoxide
  - fzf
  - visual-studio-code-bin
  - go
  - entr # for monitoring file events for diff
  - gron # same
  - firefox
  - libappindicator
  - dropbox
  - nautilus-dropbox
  - discord
  - docker-compose
  - freerdp
  - aria2
  - grim
  - slurp
  - wayfreeze
  - satty
  - psmisc # killall, used by screenshot.sh
  - lib32-fontconfig # fc-cache-32, used by the windows fonts command
  - cachyos-gaming-meta
  - cachyos-gaming-applications
  - 7zip
  - spotify-launcher
  - jq # verterm dropdown scripts
  - attr # setfattr, used by the mudengine dropbox ignores command
  - python-watchdog # media-organizer
  - python-yaml # media-organizer
  - python-pyexiftool # media-organizer (AUR)
  - perl-image-exiftool # media-organizer

services:
  - service: gcr-ssh-agent.socket
    user: true
  - service: tailscaled.service
  - service: media-organizer.service
    user: true
    depends:
      - packages: [python-watchdog, python-yaml, python-pyexiftool, perl-image-exiftool]
      - files:
          - ~/.config/systemd/user/media-organizer.service
          - ~/.local/lib/media-organizer/media_organizer.py
          - ~/.config/media-organizer/config.yaml

files:
  # SSH keys and config (written first; dotfiles clone depends on them)
  - source: ${secrets.ssh.id_ed25519}
    target: "~/.ssh/id_ed25519"
    mode: "0600"

  - source: ${secrets.ssh.id_rsa}
    target: "~/.ssh/id_rsa"
    mode: "0600"

  - source: ${secrets.ssh.config}
    target: "~/.ssh/config"

  # ── Folder links into ~ ──────────────────────────────────────────────────
  # ~/code and ~/work are the stable paths everything else refers to, so a
  # Dropbox reorganisation only changes these two sources.
  - source: ~/Dropbox/Ray/Code
    target: ~/code
    symlink: true

  - source: ~/Dropbox/Ray/Work
    target: ~/work
    symlink: true

  # Niri compositor config
  - source: ${config_root}/files/niri/screenshot.sh
    target: ~/.config/niri/screenshot.sh
    symlink: true
    mode: "+x"

  - source: ${config_root}/files/niri/verterm-dropdown-toggle.sh
    target: ~/.config/niri/verterm-dropdown-toggle.sh
    symlink: true
    mode: "+x"
    depends:
      - packages: [jq]

  - source: ${config_root}/files/niri/verterm-dropdown-autohide.sh
    target: ~/.config/niri/verterm-dropdown-autohide.sh
    symlink: true
    mode: "+x"
    depends:
      - packages: [jq]

  - source: ${config_root}/files/niri/rules.kdl
    target: ~/.config/niri/rules.kdl
    symlink: true

  - source: ${config_root}/files/niri/spawn.kdl
    target: ~/.config/niri/spawn.kdl
    symlink: true

  - source: ${config_root}/files/niri/binds.kdl
    target: ~/.config/niri/binds.kdl
    symlink: true

  - content: |

      // added by stay
      include "rules.kdl"
      include "spawn.kdl"
      include "binds.kdl"
    target: ~/.config/niri/config.kdl
    add: true

  - content: |
      
      # stay
      copy-on-select = true
    target: ~/.config/ghostty/config
    add: true

  # Application config files
  - source: ${config_root}/files/config/electron-flags.conf
    target: ~/.config/electron-flags.conf
    symlink: true

  # Fish shell functions
  - content: |
      function watchdiff
        set file $argv[1]
        set backup ".$file.bak"

        # Create the initial backup if it doesn't exist
        cp $file $backup

        echo "Watching $file... (Ctrl+C to stop)"

        # We use -p to postpone the first run until a change actually occurs
        echo $file | entr -s "diff -u $backup $file; cp $file $backup"
      end
    target: ~/.config/fish/functions/watchdiff.fish
    mode: "+x"
    depends:
      - packages: [entr]

  - content: |
      function watchjson
        set file $argv[1]
        set old_flat "/tmp/$file.old.txt"
        set new_flat "/tmp/$file.new.txt"

        # Initial state
        gron $file > $old_flat

        echo "Watching JSON paths in $file... (Ctrl+C to stop)"

        # Watch the file, flatten it, diff it, then update the "old" snapshot
        echo $file | entr -s "gron $file > $new_flat; diff -u $old_flat $new_flat | grep '^[-+][^---]'; mv $new_flat $old_flat"
      end
    target: ~/.config/fish/functions/watchjson.fish
    mode: "+x"
    depends:
      - packages: [gron]

  # Node, Electron libs, xvfb, neovim and the claude CLI for the code-server container
  - source: ${config_root}/files/code-server/90-dev-tools.sh
    target: /storage/apps/code-server-init/90-dev-tools.sh
    mode: "0755"
    sudo: true

  # The container's own ~/.ssh (/config is its home): the same github.com
  # key and config as the desktop, so pushes go out as rayzorben
  - source: ${secrets.ssh.id_ed25519}
    target: /storage/apps/code-server/.ssh/id_ed25519
    mode: "0600"

  - content: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKBoMkTnztfde1TGffhY4EBd4fYlPCSU3Ltcy//4abR3 raymond.bennett@gmail.com
    target: /storage/apps/code-server/.ssh/id_ed25519.pub
    mode: "0644"

  - source: ${secrets.ssh.config}
    target: /storage/apps/code-server/.ssh/config
    mode: "0600"

  # Holds the key's passphrase for the container; `ssh-add ~/.ssh/id_ed25519` once per start
  - source: ${config_root}/files/code-server/ssh-agent
    target: /storage/apps/code-server-services/ssh-agent
    mode: "0755"
    sudo: true

  # ── Media organizer ──────────────────────────────────────────────────────
  # Watches Dropbox's Camera Uploads and moves each photo/video into
  # Photos/YYYY/MM/, tagging it (XMP) so it is never processed twice. Failures
  # go to Photos/Errors. Runs as a user service (linger keeps it up headless).
  # Copied, not symlinked: Dropbox must not rewrite it while it runs. After
  # changing the script, `systemctl --user restart media-organizer`.
  - source: ${config_root}/files/media-organizer/media_organizer.py
    target: ~/.local/lib/media-organizer/media_organizer.py
    mode: "0755"

  - source: ${config_root}/files/media-organizer/config.yaml
    target: ~/.config/media-organizer/config.yaml

  - content: |
      [Unit]
      Description=Organize Dropbox Camera Uploads into Photos

      [Service]
      Type=simple
      # Arch installs exiftool under vendor_perl, which only login shells add
      Environment=PATH=/usr/bin:/usr/bin/vendor_perl
      ExecStart=/usr/bin/python3 %h/.local/lib/media-organizer/media_organizer.py -c %h/.config/media-organizer/config.yaml
      # Exits non-zero if /storage isn't mounted yet; keep retrying
      Restart=on-failure
      RestartSec=30
      KillSignal=SIGTERM
      TimeoutStopSec=30

      [Install]
      WantedBy=default.target
    target: ~/.config/systemd/user/media-organizer.service

ghostty: !include "./commands/ghostty.yaml"

commands:
  - name: git config
    command: |
      git config --global user.name "Raymond Bennett"
      git config --global user.email "raymond.bennett@gmail.com"
    depends:
      - packages: [git]
    rollback: |
      git config --global --unset user.name
      git config --global --unset user.email

  - name: wheel no password
    command: |
      sed -i 's/%wheel ALL=(ALL) ALL/%wheel ALL=(ALL) NOPASSWD: ALL/' /etc/sudoers.d/10-installer
    sudo: true

  - name: windows fonts
    command: |
      pushd ~/Downloads/isos
      7z e Win11_25H2_English_x64_v2.iso sources/install.wim -aoa
      7z e install.wim 1/Windows/{Fonts/"*".{ttf,ttc},System32/Licenses/neutral/"*"/"*"/license.rtf} -o/tmp/fonts/ -aoa
      mkdir -p /usr/local/share/fonts/WindowsFonts
      cp /tmp/fonts/*.ttf /usr/local/share/fonts/WindowsFonts/
      chmod -R 644 /usr/local/share/fonts/WindowsFonts/*
      fc-cache --force
      fc-cache-32 --force
    sudo: true
    depends:
      - packages: [7zip, lib32-fontconfig] # lib32-fontconfig: fc-cache-32
      - files: [~/Downloads/isos/Win11_25H2_English_x64_v2.iso]
      - folders: ["!/usr/local/share/fonts/WindowsFonts"]
      
  - name: tailscale
    command: |
      tailscale up --authkey=${secrets.tailscale_key}
      tailscale configure systray --enable-startup=systemd
      tailscale set --operator=$USER
    sudo: true
    depends:
      - services: [tailscaled.service]
      - packages: [tailscale]

  # Build output is Dropbox-ignored on the laptop; ignore it here too so a
  # build in the code-server container never syncs back. build/ is tracked in
  # git but never synced, so restore it from git.
  - name: mudengine dropbox ignores
    command: |
      cd ~/code/mudengine
      for d in node_modules out dist build .claude/worktrees; do
        mkdir -p "$d"
        setfattr -n user.com.dropbox.ignored -v 1 "$d"
      done
      git checkout -- build
    depends:
      - packages: [attr, git]
      - folders: [~/code/mudengine/.git]

scripts:
  - script: ${config_root}/scripts/configure-zoxide.sh
    depends:
      - packages: [zoxide, fzf]

flatpak:
  remotes:
    - name: flathub
      url: https://dl.flathub.org/repo/flathub.flatpakrepo

  apps:
    - app: com.usebottles.bottles

containers:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    ports:
      - 8443:8443
    volumes:
      - /storage/apps/code-server:/config
      - /storage/dropbox/Dropbox:/storage
      # linuxserver runs these as root on every start; they must be root-owned
      - /storage/apps/code-server-init:/custom-cont-init.d:ro
      - /storage/apps/code-server-services:/custom-services.d:ro
    # Electron (mudengine smokes) needs more than docker's 64 MB /dev/shm
    shm_size: 2gb
    # mudengine's probes and check:live target orohost:2427 by name
    extra_hosts:
      - orohost:host-gateway
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Phoenix
      DEFAULT_WORKSPACE: /storage
      PWA_APPNAME: code-server
      PROXY_DOMAIN: ${secrets.code.proxy_domain}
      PASSWORD: ${secrets.code.pass}
      SUDO_PASSWORD: ${secrets.code.pass}
      SSH_AUTH_SOCK: /config/.ssh/agent.sock
    depends:
      - services: [docker]
      - files: [/storage/apps/code-server-init/90-dev-tools.sh, /storage/apps/code-server-services/ssh-agent]

json:
  - file: ~/.config/DankMaterialShell/settings.json
    depends:
      - commands: [install dms]
    json:
      use24HourClock: false
      showSeconds: true
      clockDateFormat: "dddd, MMMM d"
      lockDateFormat: "dddd, MMMM d"
      useFahrenheit: true
      useAutoLocation: true
      animationSpeed: 2
      cornerRadius: 6
      fontFamily: "LucidaProgrammer Nerd Font Mono"
      monoFontFamily: "LucidaProgrammer Nerd Font Mono"
      showWorkspaceIndex: true
      workspaceDragReorder: false
      workspaceFocusedBorderEnabled: true
      blurForegroundLayers: true
      barConfigs[0]:
        openOnOverview: true
        borderEnabled: true
        borderOpacity: 0.5
        squareCorners: true
        maximizeWidgetText: true
        maximizeWidgetIcons: true
        widgetOutlineEnabled: false
        widgetOutlineOpacity: 0.5
        leftWidgets:
          - "workspaceSwitcher"
          - "focusedWindow"
          - {}
        centerWidgets:
          - "clock"
          - "weather"
          - {}
      cursorSettings.size: 28
