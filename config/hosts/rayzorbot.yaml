# rayzorbot — Thunderobot Zero Air 15, cachygram's replacement.
# Core Ultra 7 356H (Panther Lake, Xe3 iGPU on the xe driver), RTX 5060 Laptop
# (Blackwell), 64G RAM, 2TB NVMe. Installed by `scripts/bootstrap.sh rayzorbot`.
#
# Everything generic lives in hosts/common/laptop.yaml, included below; this
# file is only what this machine's hardware needs. None of cachygram's LG Gram
# fixes apply here: the i915 flags (this iGPU is xe-only), the ALC298 speaker
# verbs, the EC thermal envelope, the LG WMI keyboard backlight, the UCSI
# blacklist and the AX211 autosuspend rule all target hardware this box lacks.
#
# Audio is plain HDA, not SoundWire: a Realtek ALC255 (Clevo board, subsystem
# 1558:f551) driving the two speakers from one pin, no smart amp or woofer.
# The speaker EQ that stands in for Windows' DSP is in users/rayben-rayzorbot.yaml.
#
# Not yet known, check on first boot before adding anything for them:
#   bluetooth  lsusb — which chip, and whether bt-headset-watchdog's headset
#              drops calls on it the way it did on cachygram's AX211.
#
# Keyboard backlight, Fn keys, performance profile, charge limit: thunderlight
# (~/code/thunderlight), below. They all go through the board's Clevo firmware
# interface \_SB.DCHU (CLV0001), the one Thunderobot's Windows Control Center
# (Clevo CC 3.0) uses; the Fn light keys only notify the OS, so without the
# daemon they do nothing. Tested Nov 10 2026: colour, four levels, on/off, Fn
# events and profiles work; one zone; no firmware effects. If the backlight
# goes dark and stays dark even through `tl kbd apply`, the EC has wedged:
# shut down, unplug the charger, hold the power button 60s, boot.

laptop: !include "./common/laptop.yaml"

packages:
  # ── NVIDIA RTX 5060 (Blackwell) ──
  # Blackwell runs only on the open kernel modules; prebuilt for both kernels
  # bootstrap.sh installs (it also puts them in the pacstrap transaction, so
  # the first boot has the driver and nvidia-utils' nouveau blacklist).
  # nvidia-utils sets nvidia_drm modeset=1 itself, so the cmdline needs nothing.
  - linux-cachyos-nvidia-open
  - linux-cachyos-lts-nvidia-open
  - nvidia-utils
  - lib32-nvidia-utils # Steam/Proton, beside lib32-vulkan-intel
  - nvidia-prime # prime-run: render one app on the dGPU
  # Not nvidia-powerd (Dynamic Boost): with it running, the dGPU of another
  # RTX 5060 laptop never reached runtime D3, so it drained the battery idle.

  # ── thunderlight's kernel module is built by DKMS for both kernels ──
  - dkms
  - linux-cachyos-headers
  - linux-cachyos-lts-headers

files:
  # nvidia-open 615.78.08 hangs in nv_pci_shutdown at poweroff on RTX 5060
  # laptops (GB206M): the journal ends, the machine stays on until the power
  # button is held; reboot is fine. Unloading the modules first avoids it
  # (NVIDIA/open-gpu-kernel-modules#1412 is the unmerged fix). ExecStop runs
  # after the display manager has stopped, since this unit starts before it.
  # Drop this once a driver release fixes the hang.
  - content: |
      # Managed by stay-go.
      [Unit]
      Description=Unload NVIDIA modules before poweroff (nv_pci_shutdown hang workaround)
      Before=systemd-user-sessions.service display-manager.service
      Before=plymouth-poweroff.service plymouth-reboot.service plymouth-halt.service plymouth-kexec.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/true
      ExecStop=-/usr/bin/modprobe -r nvidia_drm nvidia_modeset nvidia_uvm nvidia
      TimeoutStopSec=30

      [Install]
      WantedBy=multi-user.target
    target: /etc/systemd/system/nvidia-unload.service
    sudo: true

  # thunderlightd's settings. Fn keys and `tl` change the live ones (kept in
  # /var/lib/thunderlight/state.json); a change to this file resets them to it.
  # charge: "start end" in %, off, or keep (leave the firmware's alone).
  # palette: what Fn+mode steps through.
  # profile / ppd on AC; on battery the battery_curve step for the charge
  # ("<from %> <profile> <ppd>", highest first), switched on plug and unplug
  # and stepped down as the battery drains (never back up until plugged in).
  # ppd = power-profiles-daemon: CPU EPP and Intel's SoC power slider. The
  # firmware profiles are CPU power limits, measured Nov 10 2026: quiet and
  # powersave PL1/PL2 23/29 W, entertainment 36/45 W, performance 65/65 W;
  # quiet also runs the fans slower.
  # Full power on AC and down to 70% (the charge window's floor, so a short
  # unplug changes nothing), then balanced, power saving, and quiet last.
  - content: |
      # Managed by stay-go.
      colour = 0000ff
      level = 4
      profile = performance
      ppd = performance
      battery_curve = 70 performance performance, 50 entertainment balanced, 30 powersave power-saver, 0 quiet power-saver
      charge = 70 80
      palette = 0000ff 00ffff 00ff00 ffff00 ff8000 ff0000 ff00ff ffffff
    target: /etc/thunderlight.conf
    sudo: true

services:
  # Save and restore VRAM across suspend and hibernate (nvidia-utils ships the
  # units; without them the desktop comes back from sleep with corrupt or
  # missing surfaces).
  - service: nvidia-suspend
    depends:
      - packages: [nvidia-utils]
  - service: nvidia-resume
    depends:
      - packages: [nvidia-utils]
  - service: nvidia-hibernate
    depends:
      - packages: [nvidia-utils]

  - service: nvidia-unload
    depends:
      - files: [/etc/systemd/system/nvidia-unload.service]

  - service: thunderlightd
    depends:
      - commands: [thunderlight]
      - files: [/etc/thunderlight.conf]

commands:
  # Module source to DKMS, tl and thunderlightd to /usr/local, the unit to
  # /etc/systemd/system. The check re-runs it whenever the ~/code/thunderlight
  # tree differs from what is installed, or a kernel lacks the module.
  - name: thunderlight
    command: ~/code/thunderlight/install.sh
    check: ~/code/thunderlight/install.sh --check
    sudo: true
    depends:
      - packages: [dkms, linux-cachyos-headers, linux-cachyos-lts-headers]
      # ~/code is Dropbox: on a fresh install the tree arrives only once
      # Dropbox has synced, so skip until then instead of failing.
      - folders: [~/code/thunderlight]

backups: !include "./rayzorbot/backups.yaml"
