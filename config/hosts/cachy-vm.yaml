# cachy-vm — the QEMU guest scripts/bootstrap.sh installs and tests against.
#
# Only what makes sense on virtual hardware. This file began as a copy of
# cachygram.yaml and carried LG Gram fixes that have nothing to act on here:
# the ALC298 speaker verbs (alsa-tools / necessary-verbs), the i915 PSR kernel
# flag, the UCSI typec blacklist, and the AC/battery power-profile switcher
# that cachygram has since retired (its source file is gone, so the entry
# failed). Dropping a files: entry only clears state, so a VM installed
# before this change keeps those files on disk; they act on hardware the VM
# doesn't have.

packages:
  - solaar
  - gparted
  - winboat
  - wtype
  - power-profiles-daemon
  - package: keyd
    services: [keyd]

files:
  - source: ${config_root}/files/config/solaar.yaml
    target: ~/.config/solaar/config.yaml
    symlink: true
    depends:
      - packages: [solaar]

  - content: |
      [ids]
      *

      [main]
      leftmeta = overload(meta, M-d)
            
    target: /etc/keyd/default.conf
    sudo: true
    depends:
      - packages: [keyd]

  # Kill multi-page readahead stalls on zRAM swap lookups and normalise VFS
  # cache pressure so reclaim drops dentries/inodes before thrashing anon pages.
  - content: |
      # Managed by stay-go.
      # Keep swappiness high for zram (CachyOS default is fine),
      # but adjust page-cluster to minimize multi-page read-ahead stalls on swap
      vm.page-cluster = 0

      # Encourage reclaiming cached dentries/inodes instead of thrashing anonymous pages
      vm.vfs_cache_pressure = 100
    target: /etc/sysctl.d/99-zram-tuning.conf
    sudo: true

  # Electron/Chromium apps go native Wayland instead of XWayland.
  - content: |
      # Managed by stay-go.
      ELECTRON_OZONE_PLATFORM_HINT=auto
    target: /etc/environment.d/95-electron-wayland.conf
    sudo: true

commands:
  # Same check: pattern as cachygram.yaml: a command re-runs only when its own
  # text changes, so each check compares the live system with the file. No
  # files: guards; they are plan-time and would skip a fresh install's first run.

  # Apply the sysctl drop-in now so a reboot is not required.
  - name: reload-sysctl-zram-tuning
    command: sysctl --system
    check: |
      sysctl -n vm.page-cluster | grep -qx 0 && sysctl -n vm.vfs_cache_pressure | grep -qx 100 \
        || { echo "live vm.* sysctls differ from 99-zram-tuning.conf"; exit 1; }
    sudo: true

  # keyd reads /etc/keyd/default.conf only at start; reload it after an edit.
  - name: keyd-reload
    command: |
      keyd reload
      install -Dm644 /etc/keyd/default.conf /var/lib/stay-go/applied/keyd-default.conf
    check: |
      cmp -s /etc/keyd/default.conf /var/lib/stay-go/applied/keyd-default.conf \
        || { echo "keyd config changed since the last reload"; exit 1; }
    sudo: true
    depends:
      - packages: [keyd]
      - services: [keyd]
