services:
  - service: sshd
    depends:
      - packages: [openssh]

  # ZFS import and mount at boot. These were enabled by hand; declaring them
  # means a rebuild gets them too. Everything under /storage hangs off them.
  - service: zfs-import-cache
    depends:
      - packages: [zfs-utils]
  - service: zfs-import.target
    depends:
      - packages: [zfs-utils]
  - service: zfs-mount
    depends:
      - packages: [zfs-utils]
  - service: zfs.target
    depends:
      - packages: [zfs-utils]

  # Monthly scrub of the pool (zfs-utils ships the timer template). A scrub
  # reads every block, so on the USB raidz1 it is a few hours of heavy I/O;
  # Persistent= catches a missed month after downtime.
  - service: zfs-scrub-monthly@storage.timer
    depends:
      - packages: [zfs-utils]

packages:
  - solaar
  - cachyos-zfs
  - zfs-utils
  - openssh

files:
  - source: ${config_root}/files/config/solaar.yaml
    target: ~/.config/solaar/config.yaml
    symlink: true
    depends:
      - packages: [solaar]

  - content: |
      bind = "0.0.0.0"

      [[cameras]]
      name = "driveway"
      username = "admin"
      password = "${secrets.neolink.driveway_password}"
      address = "192.168.1.22:9000"
      stream = "mainStream"
      push_notifications = false
    target: /storage/apps/neolink/neolink.toml
    sudo: true

  # atmoz/sftp reads every *.pub under /home/<user>/.ssh/keys as an authorized
  # key for that user. The container bind-mounts these two paths, so dropping
  # the key here is all that is needed for key-based login.
  - content: |
      ssh-rsa  rayben@raycachy
    target: /storage/apps/sftp/keys/rayben/raycachy.pub
    mode: "0644"
    sudo: true

  - content: |
      ssh-rsa  rayben@raycachy
    target: /storage/apps/sftp/keys/ha/raycachy.pub
    mode: "0644"
    sudo: true

  # Start docker only after the pool is mounted. Without it nothing orders the
  # two, and a container that starts first bind-mounts the empty /storage
  # mountpoint: docker creates the missing host paths and the app comes up on
  # blank data. Wants=, not Requires=, so a failed import still leaves docker
  # (and portainer) reachable for repair.
  - content: |
      # Managed by stay-go — see config/hosts/orohost.yaml
      [Unit]
      Wants=zfs-mount.service
      After=zfs-mount.service
    target: /etc/systemd/system/docker.service.d/10-after-zfs.conf
    mode: "0644"
    sudo: true

  # ── Never sleep ──
  # 2026-10-09: orohost booted at 14:09 and suspended at 14:24. GDM's own
  # gnome-settings-daemon (gsd-power, running for the login screen) suspends
  # after 15 minutes with no keyboard or mouse input at the machine; SSH
  # sessions, containers and running jobs do not count as activity. A server
  # must not care about any of that, so sleep is shut off at every layer —
  # any one of them alone is enough, together a single regression can't undo it:
  #   1. sleep.conf: systemd refuses every suspend/hibernate request outright
  #   2. the sleep targets are masked (command below)
  #   3. logind ignores suspend/hibernate keys, the lid, and idle
  #   4. GDM's greeter is told not to try in the first place
  # The power button still powers off cleanly; that is left alone on purpose.
  - content: |
      # Managed by stay-go — see config/hosts/orohost.yaml (Never sleep).
      [Sleep]
      AllowSuspend=no
      AllowHibernation=no
      AllowSuspendThenHibernate=no
      AllowHybridSleep=no
    target: /etc/systemd/sleep.conf.d/10-server-no-sleep.conf
    mode: "0644"
    sudo: true

  - content: |
      # Managed by stay-go — see config/hosts/orohost.yaml (Never sleep).
      [Login]
      HandleSuspendKey=ignore
      HandleHibernateKey=ignore
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
      IdleAction=ignore
    target: /etc/systemd/logind.conf.d/10-server-no-sleep.conf
    mode: "0644"
    sudo: true

  # GDM's dconf profile normally ships only in /usr/share/dconf/profile/gdm
  # (user-db + the greeter defaults). This copy in /etc takes precedence and adds
  # a system-db so the greeter can carry the override below. It takes effect the
  # next time the greeter starts; layers 1–2 already block sleep until then.
  - content: |
      user-db:user
      system-db:gdm
      file-db:/usr/share/gdm/greeter-dconf-defaults
    target: /etc/dconf/profile/gdm
    mode: "0644"
    sudo: true

  - content: |
      # Managed by stay-go — see config/hosts/orohost.yaml (Never sleep).
      [org/gnome/settings-daemon/plugins/power]
      sleep-inactive-ac-type='nothing'
      sleep-inactive-battery-type='nothing'
    target: /etc/dconf/db/gdm.d/10-no-sleep
    mode: "0644"
    sudo: true

  # Stable per-GPU device names for the two media servers.
  #
  # This box has two amdgpu cards: the discrete RX 9070 (Navi 48 / GFX12, PCI
  # 03:00.0) and the 9950X3D's integrated Radeon (GFX1036, PCI 12:00.0). They
  # are NOT interchangeable between Plex and Jellyfin, because the two apps
  # ship completely different VAAPI stacks:
  #
  #   Plex     links its transcoder against a private musl libc
  #            (/usr/lib/plexmediaserver/lib/ld-musl-x86_64.so.1) and can only
  #            load the musl-built radeonsi driver Plex itself downloads. That
  #            driver's chip table ends at GFX11, so the RX 9070 dies at init:
  #              amdgpu: unknown (family_id, chip_external_rev): (152, 81)
  #              libva: radeonsi_drv_video.so init failed
  #              Failed to initialise VAAPI connection: 2
  #            The transcoder exits, the client stalls and retries for ~2
  #            minutes, then limps on via Direct Play. No distro or host Mesa
  #            can be substituted in — the glibc/musl split makes it
  #            unloadable. So Plex gets the iGPU, which its driver does know.
  #
  #   Jellyfin is ordinary glibc (Debian trixie) and bundles its own Mesa
  #            25.0.7 under /usr/lib/jellyfin-ffmpeg/lib/dri, which recognises
  #            gfx1201 and drives the RX 9070 at ~14x realtime including AV1
  #            encode. So Jellyfin gets the dGPU.
  #
  # /dev/dri/renderD1NN numbering is *not* stable — on this host card0 is the
  # iGPU while renderD128 is the dGPU, so the two minor pools are already
  # inverted and probe order cannot be relied on across kernels. Getting these
  # two swapped would silently break both servers. The by-path links
  # (pci-0000:12:00.0-render) are stable but contain colons, which docker
  # cannot parse in a `--device src:dst` spec. Hence this rule: match each card
  # by PCI vendor:device and give it a colon-free, reboot-stable alias.
  - content: |
      # Managed by stay-go — see config/hosts/orohost.yaml
      # AMD Granite Ridge iGPU (1002:13c0) → /dev/dri/plex-render
      SUBSYSTEM=="drm", KERNEL=="renderD*", ATTRS{vendor}=="0x1002", ATTRS{device}=="0x13c0", SYMLINK+="dri/plex-render"
      # AMD Navi 48 / RX 9070 dGPU (1002:7550) → /dev/dri/jellyfin-render
      SUBSYSTEM=="drm", KERNEL=="renderD*", ATTRS{vendor}=="0x1002", ATTRS{device}=="0x7550", SYMLINK+="dri/jellyfin-render"
    target: /etc/udev/rules.d/99-media-gpu.rules
    mode: "0644"
    sudo: true

commands:
  # Persist the sftp server's host keys outside the container so client
  # known_hosts entries survive a recreate. These files must exist as *files*
  # before the container starts — docker would otherwise create the bind-mount
  # targets as empty directories. ssh-keygen refuses to overwrite, so this is
  # idempotent, but the folder condition keeps it out of the plan once done.
  - name: sftp host keys
    command: |
      mkdir -p /storage/apps/sftp/ssh
      ssh-keygen -t ed25519 -N "" -f /storage/apps/sftp/ssh/ssh_host_ed25519_key
      ssh-keygen -t rsa -b 4096 -N "" -f /storage/apps/sftp/ssh/ssh_host_rsa_key
      chmod 600 /storage/apps/sftp/ssh/ssh_host_*_key
    sudo: true
    depends:
      - folders: ["!/storage/apps/sftp/ssh"]
    rollback: |
      rm -rf /storage/apps/sftp/ssh

  # udev applies /etc/udev/rules.d automatically at boot, so this only matters
  # on the first apply after the rule lands (and after any edit to it): reload
  # and re-trigger so /dev/dri/{plex,jellyfin}-render exist before the two
  # media containers are created. Deliberately carries no files:/folders:
  # condition — those are evaluated at *plan* time, before the rule file has
  # been written, so a condition here would skip the command on a fresh build,
  # and a SKIPped dep propagates as unmet and would drag both containers down
  # with it. Both udevadm calls are idempotent; the command re-runs only when
  # its own text changes.
  #
  # It re-runs only when its own text changes, never when the rule changes, so
  # the check compares the rule with the copy taken at the last reload and
  # confirms both aliases exist.
  - name: media gpu udev reload
    command: |
      udevadm control --reload-rules
      udevadm trigger --subsystem-match=drm --action=change
      udevadm settle
      install -Dm644 /etc/udev/rules.d/99-media-gpu.rules /var/lib/stay-go/applied/99-media-gpu.rules
    check: |
      cmp -s /etc/udev/rules.d/99-media-gpu.rules /var/lib/stay-go/applied/99-media-gpu.rules \
        || { echo "99-media-gpu.rules changed since the last udev reload"; exit 1; }
      test -e /dev/dri/plex-render && test -e /dev/dri/jellyfin-render \
        || { echo "a /dev/dri media alias is missing"; exit 1; }
    sudo: true
    rollback: |
      udevadm control --reload-rules
      udevadm trigger --subsystem-match=drm --action=change
      rm -f /var/lib/stay-go/applied/99-media-gpu.rules

  # systemd reads the docker drop-in above only on daemon-reload (or reboot).
  # Ordering is all it changes, so docker itself is not restarted.
  - name: docker after zfs reload
    command: systemctl daemon-reload
    check: |
      systemctl show docker.service -p After --value | grep -qw zfs-mount.service \
        || { echo "docker.service is not yet ordered after zfs-mount.service"; exit 1; }
    sudo: true

  # Never sleep, layer 2: mask every sleep target. Hand-masked on 2026-10-09
  # after the suspend, except suspend-then-hibernate, which was missed.
  - name: mask sleep targets
    command: |
      systemctl mask sleep.target suspend.target hibernate.target \
        hybrid-sleep.target suspend-then-hibernate.target
    check: |
      for t in sleep suspend hibernate hybrid-sleep suspend-then-hibernate; do
        systemctl is-enabled $t.target 2>/dev/null | grep -qx masked \
          || { echo "$t.target is not masked"; exit 1; }
      done
    rollback: |
      systemctl unmask sleep.target suspend.target hibernate.target \
        hybrid-sleep.target suspend-then-hibernate.target
    sudo: true

  # Never sleep, layer 3: logind reads its drop-ins only on start or reload.
  # A reload keeps every session alive. Stamp check, as for the udev rule.
  - name: logind reload no-sleep
    command: |
      systemctl reload systemd-logind
      install -Dm644 /etc/systemd/logind.conf.d/10-server-no-sleep.conf /var/lib/stay-go/applied/logind-no-sleep.conf
    check: |
      cmp -s /etc/systemd/logind.conf.d/10-server-no-sleep.conf /var/lib/stay-go/applied/logind-no-sleep.conf \
        || { echo "logind no-sleep drop-in changed since the last reload"; exit 1; }
    sudo: true

  # Never sleep, layer 4: compile /etc/dconf/db/gdm.d into the gdm database.
  - name: dconf update gdm no-sleep
    command: |
      dconf update
      install -Dm644 /etc/dconf/db/gdm.d/10-no-sleep /var/lib/stay-go/applied/dconf-gdm-no-sleep
    check: |
      test -f /etc/dconf/db/gdm && cmp -s /etc/dconf/db/gdm.d/10-no-sleep /var/lib/stay-go/applied/dconf-gdm-no-sleep \
        || { echo "gdm dconf override not compiled yet"; exit 1; }
    sudo: true

  # ─── media acquisition stack ───────────────────────────────────────────────
  #
  # Directory scaffolding for prowlarr/sonarr/radarr/qbittorrent, and the one
  # decision that makes this stack fast or slow: WHERE downloads land.
  #
  # Sonarr and Radarr import by hardlinking the finished download into the
  # library — one inode, two names, zero bytes copied, and the torrent keeps
  # seeding from the very same data. link(2) only works within a single
  # filesystem, and on ZFS every dataset IS a separate filesystem. This pool
  # carries storage/tv and storage/movies as sibling datasets, so the usual
  # shared /storage/downloads would sit on a third one and every link would
  # fail with EXDEV. Measured on this pool:
  #
  #   $ ln /storage/tv/f /storage/movies/f
  #   ln: failed to create hard link: Invalid cross-device link
  #
  # The *arrs treat that failure as routine and silently fall back to a full
  # copy, so nothing ever looks broken — you just pay a whole-season read+write
  # through the USB-attached raidz1 on every import and hold two copies of
  # everything for as long as it seeds.
  #
  # So the download directories live INSIDE each library dataset instead:
  #   /storage/tv/.downloads      → dataset storage/tv      (st_dev 161)
  #   /storage/movies/.downloads  → dataset storage/movies  (st_dev 157)
  # Same filesystem as the library they feed, so links succeed. Dot-prefixed
  # because Plex skips hidden directories natively; the .ignore marker is what
  # makes Jellyfin skip them too.
  #
  # install -d rather than mkdir -p: it also *repairs* owner and mode on
  # directories that already exist, so a botched permission never survives an
  # apply. 1000:1000 is rayben, which is what all four containers run as
  # (PUID/PGID below), and 0775 pairs with UMASK=002 so everything the apps
  # create stays group-writable.
  #
  # No rollback on purpose: the only thing it could undo is deleting download
  # directories, which would take in-flight torrents and not-yet-imported media
  # with them. Removing this command from the config should not destroy data.
  - name: media stack directories
    command: |
      install -d -o 1000 -g 1000 -m 0775 \
        /storage/tv/.downloads \
        /storage/tv/.downloads/complete \
        /storage/tv/.downloads/incomplete \
        /storage/movies/.downloads \
        /storage/movies/.downloads/complete \
        /storage/movies/.downloads/incomplete \
        /storage/apps/qbittorrent/config \
        /storage/apps/qbittorrent/downloads \
        /storage/apps/sonarr/config \
        /storage/apps/radarr/config \
        /storage/apps/prowlarr/config
      touch /storage/tv/.downloads/.ignore /storage/movies/.downloads/.ignore
    sudo: true

  # A user-defined bridge so the four containers can address each other by name
  # (prowlarr → sonarr:8989, sonarr → qbittorrent:8080) instead of hairpinning
  # back out to 192.168.1.50. Docker's embedded DNS resolves container names
  # only on user-defined networks — never on the default bridge — and a
  # name-addressed stack survives the host changing IP.
  #
  # No sudo: rayben is in the docker group. Unconditional and idempotent for
  # exactly the same reason as "media gpu udev reload" above — a files:/folders:
  # guard is evaluated at plan time and would make this SKIP, and a SKIPped
  # dependency propagates as unmet, which would strand all four containers.
  - name: media docker network
    command: |
      docker network inspect media >/dev/null 2>&1 || docker network create media
    rollback: |
      docker network rm media

# containers: accepts either a sequence of entries (stay-go's native form) or a
# docker-compose-style mapping keyed by container name (used below).
containers:
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - 8000:8000
      - 9443:9443
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /storage/apps/portainer:/data
    depends:
      - packages: [docker]

  frigate:
    container_name: frigate
    lock: true # skipped by bulk --update; upgrade explicitly with --update=containers/frigate
    privileged: true # this may not be necessary for all setups
    restart: unless-stopped
    stop_grace_period: 30s # allow enough time to shut down the various services
    image: ghcr.io/blakeblackshear/frigate:stable-rocm
    shm_size: "1gb" # update for your cameras based on calculation above
    devices:
      - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
      - /dev/dri:/dev/dri # AMD / Intel GPU, needs to be updated for your hardware
      - /dev/kfd:/dev/kfd
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /storage/frigate/config:/config
      - /storage/frigate/recordings:/media/frigate
      - type: tmpfs # 1GB In-memory filesystem for recording segment storage
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      LIBVA_DRIVER_NAME: "radeonsi"
      FRIGATE_RTSP_PASSWORD: "${secrets.frigate.rtsp_password}"
      MQTT_PASSWORD: "${secrets.frigate.mqtt_password}"
      PLUS_API_KEY: "${secrets.frigate.plus_api_key}"
    depends:
      - packages: [docker]

  adguardhome:
    container_name: adguardhome
    restart: unless-stopped
    volumes:
        - /storage/apps/adguard:/opt/adguardhome/work
        - /storage/apps/adguard/configr:/opt/adguardhome/conf
    ports:
        - 192.168.1.50:53:53/tcp
        - 192.168.1.50:53:53/udp
        - 8081:80/tcp
        - 3000:3000/tcp
    image: adguard/adguardhome
    depends:
      - packages: [docker]

  neolink:
    container_name: neolink
    restart: unless-stopped
    image: quantumentangledandy/neolink:latest
    volumes:
      - /storage/apps/neolink/neolink.toml:/etc/neolink.toml
    ports:
      - "8556:8554"
    depends:
      - packages: [docker]
      - files: [/storage/apps/neolink/neolink.toml]

  plex:
    container_name: plex
    # Disabled: the entry is dropped from the config, so the tracked container
    # is planned as REMOVE. Delete this line to bring Plex back.
    disabled: true
    restart: unless-stopped
    image: plexinc/pms-docker:latest
    # Host networking is what Plex recommends on Linux — GDM discovery, DLNA
    # (1900/udp) and the 32410-32414/udp range all work without publishing each
    # port individually. The server lives at http://192.168.1.50:32400/web.
    network_mode: host
    devices:
      # Exactly one render node, and it is the iGPU. Plex builds its hardware
      # transcode device list by enumerating /dev/dri/renderD*, so handing it
      # the whole directory let it auto-select the RX 9070 and fail (see the
      # 99-media-gpu.rules file entry above for the full story). The host alias
      # is the udev symlink, presented inside the container under the
      # conventional renderD128 name that Plex expects to find.
      - /dev/dri/plex-render:/dev/dri/renderD128
    environment:
      TZ: "America/Phoenix"
      # First run only: links the server to the Plex account. Claim tokens from
      # https://plex.tv/claim expire 4 minutes after they are generated — if
      # this one has gone stale, put a fresh token in secrets.plex.claim above
      # (plaintext; stay-go re-encrypts it) before applying. Once /config holds
      # a claimed server the token is ignored.
      PLEX_CLAIM: "${secrets.plex.claim}"
      # pms-docker drops privileges to the "plex" user (PLEX_UID, default 1000).
      # stay-go's containers resource has no group_add, so that user cannot be
      # put in the host's render group — run the server as root instead so
      # /dev/dri/renderD128 is readable no matter how udev labels it.
      PLEX_UID: "0"
      PLEX_GID: "0"
      # Uncomment to reach the setup UI from the LAN without signing in — the
      # recovery path if the claim token expired and the server came up
      # unclaimed (Plex otherwise only allows setup from localhost).
      # ALLOWED_NETWORKS: "192.168.1.0/24"
    volumes:
      - /storage/apps/plex/config:/config # database + metadata; grows large
      # Transcoder scratch space. This used to bind-mount /storage/apps/plex/
      # transcode, which put every segment write on the USB-attached raidz1 —
      # the pool reads media at ~112 MB/s but there is no reason to make it
      # absorb scratch writes too. The host has 60 GB of RAM; segments are
      # deleted as the client consumes them, so this never approaches its cap.
      - type: tmpfs
        target: /transcode
        tmpfs:
          size: 16g
      - /storage/movies:/movies:ro # add as a library in the UI: /movies
      - /storage/tv:/tv:ro
      - /etc/localtime:/etc/localtime:ro
    depends:
      - packages: [docker]
      # The udev rule must be on disk and loaded before `docker run --device
      # /dev/dri/plex-render` can resolve. Both are unconditional nodes, so
      # neither can plan as SKIP and strand the container.
      - files: [/etc/udev/rules.d/99-media-gpu.rules]
      - commands: [media gpu udev reload]

  # Jellyfin — running alongside plex, not replacing it, so the two can be
  # compared on the same library and the same clients before anything is
  # retired. Nothing is shared between them: separate ports, separate config
  # trees, separate GPUs, and both media mounts are read-only, so neither can
  # disturb the other or the pool.
  #
  # FIRST-RUN GOTCHA (10.11.11), worth knowing before you burn an afternoon:
  # after the initial library scan, series pages can come up with an empty
  # Seasons row and every play attempt fails with
  #   "Unable to find a valid media source to play."
  # That message is a lie on two counts — it is the web client's
  # PlaybackError.NO_MEDIA_ERROR, raised when the <video> element reports 0x0,
  # and the real cause is server-side. The episodes scan fine and are fully
  # playable (/Items?includeItemTypes=Episode&recursive=true returns them all,
  # and the HLS transcode serves real segments), but the *hierarchy* queries
  # return nothing:
  #   /Shows/{series}/Episodes  -> 0
  #   /Shows/{series}/Seasons   -> 0
  #   /Shows/NextUp             -> 0
  # because the series' PresentationUniqueKey is written provider-style
  # ("390430-en-<libraryid>") while its children get GUID-style
  # SeriesPresentationUniqueKeys. The two never join, so nothing resolves.
  # AncestorIds is fine, which is why the library view itself looks healthy.
  #
  # Fix is a full metadata refresh per series, which recomputes the keys:
  #   POST /Items/{seriesId}/Refresh?metadataRefreshMode=FullRefresh
  #        &replaceAllMetadata=true&Recursive=true
  # or in the UI: series → ⋯ → Refresh metadata → "Replace all metadata".
  # Takes seconds and survives a restart. Doing it also merges series that are
  # split across sibling folders (e.g. "Landman Season 1 …" + "Landman Season
  # 2"), so the library layout does NOT need reorganising for this.
  jellyfin:
    container_name: jellyfin
    restart: unless-stopped
    image: jellyfin/jellyfin:latest
    # Host networking, same as plex: 8096/tcp (web UI / API) and 7359/udp (LAN
    # client auto-discovery) are reachable directly, and DLNA (1900/udp) plus
    # the server's own client-discovery broadcasts work without publishing
    # each port individually. The server lives at http://192.168.1.50:8096.
    network_mode: host
    devices:
      # The RX 9070. Jellyfin's bundled Mesa 25.0.7 recognises gfx1201 and
      # does full VAAPI decode+encode on it — h264 and AV1 both measured at
      # ~14.4x realtime on a 1080p HEVC source, against 6.0x on the iGPU.
      # Presented inside as renderD128 because that is the literal default in
      # Jellyfin's "VA-API Device" setting, so hardware acceleration works
      # from a clean config without anyone editing a device path in the UI.
      - /dev/dri/jellyfin-render:/dev/dri/renderD128
    environment:
      TZ: "America/Phoenix"
    volumes:
      # JELLYFIN_DATA_DIR — database, metadata, plugins. Grows like plex's.
      - /storage/apps/jellyfin/config:/config
      # JELLYFIN_CACHE_DIR — image cache, worth keeping across restarts since
      # regenerating it re-reads the whole library off the pool.
      - /storage/apps/jellyfin/cache:/cache
      # Transcode scratch only. Jellyfin defaults this to <cache>/transcodes;
      # docker orders mounts by path depth so this tmpfs lands on top of the
      # /cache bind above rather than racing it. Segments are deleted as the
      # client consumes them, so it never approaches the cap — and it keeps
      # scratch writes off the USB-attached raidz1 entirely.
      - type: tmpfs
        target: /cache/transcodes
        tmpfs:
          size: 16g
      # Read-only on purpose: neither media server should ever be able to
      # modify or delete the library. This has a consequence that is NOT
      # obvious and cost an afternoon once — Jellyfin defaults to writing its
      # metadata next to the media, and every one of those writes fails with
      #   System.IO.IOException: Read-only file system : '/tv/<show>/x.nfo'
      # Worse, the trickplay generator still runs a full ffmpeg pass per
      # episode *before* discovering it cannot write, so it pins a core at
      # 100% producing nothing. If a rebuild ever recreates the Jellyfin
      # libraries from scratch, turn these three off again per library
      # (Dashboard → Libraries → <library> → Manage Library):
      #   SaveLocalMetadata, SaveSubtitlesWithMedia, SaveTrickplayWithMedia
      # They live in /storage/apps/jellyfin/config/root/default/<lib>/
      # options.xml, which Jellyfin owns and rewrites, so it is deliberately
      # not managed as a stay-go file entry — fighting the app over its own
      # config would be worse than this note.
      - /storage/movies:/movies:ro
      - /storage/tv:/tv:ro
      - /etc/localtime:/etc/localtime:ro
    depends:
      - packages: [docker]
      - files: [/etc/udev/rules.d/99-media-gpu.rules]
      - commands: [media gpu udev reload]

  # ─── Media acquisition: prowlarr → {sonarr,radarr} → qbittorrent ───────────
  #
  # Division of labour: prowlarr holds every tracker definition once and pushes
  # them into both *arrs; sonarr and radarr decide what to fetch and own the
  # library layout; qbittorrent moves the bytes. Plex and Jellyfin only ever
  # read what lands, and their mounts stay :ro — these three are the only
  # things on the box allowed to write into the library.
  #
  # ── WHY THE MOUNTS LOOK LIKE THIS (two separate traps, both measured here) ──
  #
  # Sonarr and Radarr import by hardlinking the finished download into the
  # library: one inode, two names, zero bytes copied, and the torrent keeps
  # seeding from the very same data. When link(2) fails they fall back to a
  # full copy without complaint, so a broken setup looks fine and merely costs
  # a whole-season read+write through the USB raidz1 on every import, plus two
  # copies of everything for as long as it seeds. Two separate things can break
  # it, and only the first one is widely known:
  #
  # 1. ZFS datasets are separate filesystems. storage/tv and storage/movies are
  #    siblings, so a shared /storage/downloads dataset could never be linked
  #    from either. Measured on this pool:
  #      $ ln /storage/tv/f /storage/movies/f
  #      ln: failed to create hard link: Invalid cross-device link
  #    Hence downloads live INSIDE the library dataset they feed:
  #      /storage/tv/.downloads      → dataset storage/tv
  #      /storage/movies/.downloads  → dataset storage/movies
  #    Dot-prefixed because plex skips hidden directories natively, and the
  #    .ignore marker written by "media stack directories" makes jellyfin skip
  #    them too — neither should ever index a half-finished download.
  #
  # 2. Same filesystem is NOT sufficient inside a container. do_linkat() also
  #    rejects a link whose two paths sit on different *mounts*, even when both
  #    are bind mounts of the identical dataset:
  #      old_path.mnt != new_path.mnt  →  -EXDEV
  #    The first cut of this config mounted the library and its download
  #    directory separately (/tv and /downloads/tv). st_dev matched — 161 on
  #    both sides — and links still failed:
  #      ln: hard link '/tv/…': Cross-device link
  #      /proc/self/mountinfo: mountid 2512 → /tv, mountid 2514 → /downloads/tv
  #                            both major:minor 0:161
  #    So each dataset is exposed through exactly ONE bind mount per container,
  #    and the download directory is reached as a subdirectory of it. Verified:
  #    a single mount links fine, two mounts of the same dataset do not.
  #
  # ── THE PATH CONTRACT ──
  # Sonarr asks qBittorrent where a finished torrent is and qBittorrent answers
  # with a path from inside *its own* container; if Sonarr cannot resolve that
  # exact string it demands a remote-path mapping or gives up and copies. So
  # the download directories carry an identical container path in both apps:
  #
  #   host                        │ container       │ mounted in
  #   ────────────────────────────┼─────────────────┼──────────────────────
  #   /storage/tv                 │ /tv             │ sonarr
  #   /storage/tv/.downloads      │ /tv/.downloads  │ sonarr (via /tv), qbittorrent
  #   /storage/movies             │ /movies         │ radarr
  #   /storage/movies/.downloads  │ /movies/.downl… │ radarr (via /movies), qbittorrent
  #
  # qBittorrent gets only the .downloads subtree, never the library itself, but
  # at the same path Sonarr and Radarr use — so the strings match without the
  # torrent client being able to touch a single library file.
  #
  # Verified on this host: with the categories below in place, Sonarr's health
  # page is clean. DownloadClientRootFolderCheck only fires when the download
  # directory *is* a root folder, not when it sits beneath one, so nesting
  # .downloads inside /tv costs nothing. Get the categories wrong and Sonarr
  # instead falls back to qBittorrent's global save path and reports:
  #   "You are using docker; download client X places downloads in /downloads
  #    but this directory does not appear to exist inside the container."
  # That message means the category is missing or misnamed — not that the
  # volumes are wrong.
  #
  # ── SETTINGS THAT LIVE IN qBITTORRENT, NOT HERE ──
  # These are in /storage/apps/qbittorrent/config, which qBittorrent owns and
  # rewrites, so they are deliberately not stay-go file entries (same reasoning
  # as jellyfin's options.xml). A rebuild with a fresh /config loses them, and
  # imports silently degrade to cross-dataset copies until they are restored:
  #
  #   Category "tv"      save /tv/.downloads/complete
  #                      incomplete /tv/.downloads/incomplete
  #   Category "movies"  save /movies/.downloads/complete
  #                      incomplete /movies/.downloads/incomplete
  #
  # Both halves must be on the same dataset, so the completion move is a rename
  # rather than a copy. Setting the incomplete path over the API needs
  # downloadPathEnabled — without it the field silently stays null and every
  # torrent falls back to the global temp path:
  #   POST /api/v2/torrents/editCategory
  #        category=tv savePath=/tv/.downloads/complete
  #        downloadPath=/tv/.downloads/incomplete downloadPathEnabled=true
  # The global "Keep incomplete torrents in" is left OFF on purpose: it points
  # at /downloads on storage/apps, a different dataset, and any torrent that
  # used it would be copied across datasets on completion. The per-category
  # paths override it.
  #
  # All four run as PUID/PGID 1000 (rayben, who already owns /storage/tv and
  # /storage/movies) with UMASK 002. One uid across the whole stack is what lets
  # qBittorrent write a file that Sonarr can later hardlink and rename, and what
  # keeps the library owned consistently no matter which app created a file.
  #
  # NOT included, and worth knowing they exist: bazarr (subtitles, :6767),
  # recyclarr (syncs TRaSH quality profiles into sonarr/radarr instead of
  # hand-tuning them), jellyseerr (request UI in front of jellyfin/plex). Each
  # is one more container of the same shape; none is required for media to flow.
  #
  # NOT included and deliberately flagged: this box has no VPN. Tailscale is
  # not one for this purpose — it carries traffic to your own devices, not out
  # to trackers. qBittorrent below talks to the internet on the host's own IP.
  # The usual remedy is to put it behind gluetun (network_mode:
  # "container:gluetun", with the port publishing moved onto gluetun), which
  # needs provider credentials that are not in this config.

  qbittorrent:
    container_name: qbittorrent
    restart: unless-stopped
    image: lscr.io/linuxserver/qbittorrent:latest
    networks: [media]
    ports:
      - 8080:8080 # web UI
      - 6881:6881 # BitTorrent peer port, TCP
      - 6881:6881/udp # …and uTP/DHT. Forward both at the router for seeding.
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: "America/Phoenix"
      # LSIO writes these into qBittorrent.conf on first start. Setting the web
      # port here as well as in ports: keeps the two from drifting apart.
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - /storage/apps/qbittorrent/config:/config
      # Catch-all default save path for anything added by hand without a
      # category. Docker orders bind mounts by path depth, so this lands before
      # the two below — the same layering jellyfin's transcode tmpfs relies on.
      # Without it an uncategorised torrent would write into the container's
      # own filesystem and vanish on the next recreate. It sits on storage/apps,
      # a different dataset, so nothing saved here can ever be hardlinked.
      - /storage/apps/qbittorrent/downloads:/downloads
      # Category save paths. Mounted at the SAME container path sonarr and
      # radarr see them at, so no remote-path mapping is ever needed:
      #   category "tv"     → /tv/.downloads/{incomplete,complete}
      #   category "movies" → /movies/.downloads/{incomplete,complete}
      # Only the .downloads subtree is exposed — qbittorrent cannot reach, and
      # therefore cannot damage, the library it feeds.
      - /storage/tv/.downloads:/tv/.downloads
      - /storage/movies/.downloads:/movies/.downloads
      - /etc/localtime:/etc/localtime:ro
    depends:
      - packages: [docker]
      - commands: [media stack directories, media docker network]

  sonarr:
    container_name: sonarr
    restart: unless-stopped
    image: lscr.io/linuxserver/sonarr:latest
    networks: [media]
    ports:
      - 8989:8989
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: "America/Phoenix"
    volumes:
      - /storage/apps/sonarr/config:/config
      # ONE mount for the whole dataset — library at /tv, finished downloads at
      # /tv/.downloads/complete. Splitting these into two bind mounts is what
      # breaks hardlinking (see the mountinfo evidence above), so do not "tidy"
      # this into a separate /downloads entry. Read-write, unlike plex's and
      # jellyfin's /tv: sonarr renames episodes into place, creates season
      # folders and deletes files it has upgraded.
      # Root folder to add in the UI: /tv
      - /storage/tv:/tv
      - /etc/localtime:/etc/localtime:ro
    depends:
      - packages: [docker]
      - commands: [media stack directories, media docker network]

  radarr:
    container_name: radarr
    restart: unless-stopped
    image: lscr.io/linuxserver/radarr:latest
    networks: [media]
    ports:
      - 7878:7878
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: "America/Phoenix"
    volumes:
      - /storage/apps/radarr/config:/config
      # Single mount, same reasoning as sonarr's /tv above.
      # Root folder to add in the UI: /movies
      - /storage/movies:/movies
      - /etc/localtime:/etc/localtime:ro
    depends:
      - packages: [docker]
      - commands: [media stack directories, media docker network]

  # Indexer manager. Sonarr and Radarr never get trackers configured directly —
  # they are added once here and pushed out over the API, so adding or fixing a
  # tracker is a one-place change instead of two. Holds no media, so it needs no
  # mounts beyond its own config.
  prowlarr:
    container_name: prowlarr
    restart: unless-stopped
    image: lscr.io/linuxserver/prowlarr:latest
    networks: [media]
    ports:
      - 9696:9696
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: "America/Phoenix"
    volumes:
      - /storage/apps/prowlarr/config:/config
      - /etc/localtime:/etc/localtime:ro
    depends:
      - packages: [docker]
      - commands: [media stack directories, media docker network]

  sftp:
    container_name: sftp
    restart: unless-stopped
    image: atmoz/sftp:alpine
    # atmoz/sftp takes its accounts as command arguments in the form
    #   user:password[:e][:uid[:gid[:dir1[,dir2]...]]]
    # Each account is chrooted to /home/<user>; the trailing "data" creates
    # /home/<user>/data, which is the only writable directory inside the chroot
    # (sshd requires the chroot root itself to be owned by root and not
    # group/world-writable).
    command:
      - "rayben:${secrets.sftp.rayben_password}:1001"
      - "ha:${secrets.sftp.ha_password}:1002"
    ports:
      - "2222:22"
    volumes:
      # rayben's own upload directory, reached as /data after login.
      - /storage/apps/sftp/rayben:/home/rayben/data
      # ha's home is the whole storage pool: the chroot root stays /home/ha
      # (atmoz/sftp hardcodes that in sshd_config and it must remain
      # root-owned), and the host's /storage is mounted inside it under the
      # same name. ha therefore lands in / and cds into storage to see the pool.
      - /storage:/home/ha/storage
      # Authorized public keys — one *.pub per key, per user.
      - /storage/apps/sftp/keys/rayben:/home/rayben/.ssh/keys:ro
      - /storage/apps/sftp/keys/ha:/home/ha/.ssh/keys:ro
      # Persist the host keys so client known_hosts entries survive a recreate.
      - /storage/apps/sftp/ssh/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key
      - /storage/apps/sftp/ssh/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key
      - /etc/localtime:/etc/localtime:ro
    # Only depends: entries that resolve to real plan nodes may be listed here.
    # ContainerEntry.DependsOnIDs has no files:/folders: condition handling (that
    # is scripts/commands only), so every name becomes a "<type>/<name>" node ID
    # that must exist in the plan. The two *.pub files below are managed file
    # entries, so they resolve; the host keys are created by the "sftp host keys"
    # command, which is folder-guarded and plans as SKIP once they exist — and a
    # SKIP dep propagates as unmet, so it must NOT be listed.
    depends:
      - packages: [docker]
      - files:
          - /storage/apps/sftp/keys/rayben/raycachy.pub
          - /storage/apps/sftp/keys/ha/raycachy.pub

# compose: docker-compose projects brought up with `docker compose up -d`.
# The project directory is rendered into a private cache dir before each run,
# substituting ${secrets.x} (and ${var}, ~, $(cmd)) into the files' contents
# without modifying the originals — e.g. .env contains
#   DB_PASSWORD=${secrets.immich.db_password}
compose:
  - path: ${config_root}/files/docker/immich   # project name defaults to "immich"
    depends:
      - packages: [docker]

  - path: ${config_root}/files/docker/photoprism
    depends:
      - packages: [docker]

  # Footage browser for Frigate's recordings (timeline + H.264 transcoding
  # player) at http://orohost:5080 — locally built image, rebuilt on each up.
  - path: ${config_root}/files/docker/frigate-review
    depends:
      - packages: [docker]

# Kopia → Google Drive: what is backed up, the server, the tailnet UI.
backups: !include "./orohost/backups.yaml"

# Restarts neolink when the driveway camera stops recording.
neolink_watchdog: !include "./orohost/neolink-watchdog.yaml"
