packages:
  - solaar
  - alsa-tools # for hda-verb
  - gparted
  - winboat
  - wtype
  - power-profiles-daemon # supplies the balanced EPP baseline lg-gram-thermals pins
  - package: keyd
    services: [keyd]
  # LG Gram keyboard backlight (see the files block further down).
  - acpi_call-dkms
  - linux-cachyos-headers # acpi_call-dkms builds against the running kernel
  - python-evdev # solaar and lutris need it (it once served a keyboard daemon)

  # ── Hardware stack the CachyOS installer used to provide ──
  # bootstrap.sh installs a bare system; these came with the original desktop
  # install and nothing else pulls them in.

  # Audio: the Meteor Lake codec loads its DSP topology from sof-firmware, so
  # without it there is no sound card at all (necessary-verbs only patches the
  # speaker amp on top). PipeWire is the server; these are its ALSA/Pulse shims.
  - sof-firmware
  - alsa-firmware
  - alsa-utils
  - pipewire-pulse
  - pipewire-alsa
  - wireplumber
  - gst-plugin-pipewire

  # Bluetooth: bt-headset-watchdog and the autosuspend rule below assume it.
  - package: bluez
    services: [bluetooth]
  - bluez-utils
  - bluez-obex
  - bluez-hid2hci

  # Intel Arc (Meteor Lake) GPU: Vulkan, VA-API/VPL video decode, OpenCL.
  - vulkan-intel
  - intel-media-driver
  - vpl-gpu-rt
  - mesa-utils
  - opencl-mesa
  - lib32-opencl-mesa

  # OOM killer ahead of the kernel's, so a runaway process dies before the
  # desktop freezes on swap.
  - package: earlyoom
    services: [earlyoom]

  # mDNS (.local names). avahi-daemon was enabled by the installer.
  # /etc/nsswitch.conf has no mdns entry, so glibc lookups do not use it yet.
  - package: nss-mdns
    services: [avahi-daemon]

files:
  - source: ${config_root}/files/necessary-verbs.sh
    target: /usr/local/sbin/necessary-verbs.sh
    sudo: true
    mode: "+x"

  # Patches the DMS bar to hide the "Scratch" workspace. Copied rather than
  # symlinked: the pacman hook runs it as root mid-transaction, so it must not
  # depend on the repo (a Dropbox path) being readable at that moment.
  - source: ${config_root}/files/dms/hide-scratch-workspace.sh
    target: /usr/local/bin/dms-hide-scratch-workspace.sh
    sudo: true
    mode: "+x"

  - source: ${config_root}/files/dms/dms-hide-scratch.hook
    target: /etc/pacman.d/hooks/dms-hide-scratch.hook
    sudo: true
    depends:
      - files: [/usr/local/bin/dms-hide-scratch-workspace.sh]

  # Oneshot: the script applies the verbs and exits in ~2s. It used to be
  # Type=simple with Restart=always, so systemd re-ran it on every clean exit
  # until it hit the start limit and parked the unit as failed.
  - content: |
      [Unit]
      Description=Run internal speaker fix script at startup
      After=getty.target

      [Service]
      User=root
      Group=root
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/necessary-verbs.sh
      TimeoutStartSec=0

      [Install]
      WantedBy=default.target
    target: /etc/systemd/system/necessary-verbs.service
    sudo: true
    depends:
      - files: [/usr/local/sbin/necessary-verbs.sh]
      - packages: ['alsa-tools']
      
  - source: ${config_root}/files/config/solaar.yaml
    target: ~/.config/solaar/config.yaml
    symlink: true
    depends:
      - packages: [solaar]

  - content: |
      [ids]
      *

      [main]
      shift = oneshot(shift)
      leftmeta = overload(meta, M-d)
            
    target: /etc/keyd/default.conf
    sudo: true
    depends:
      - packages: [keyd]

  # ── Display / latency tuning (see commands: limine-i915-psr for the kernel flag) ──

  # Kill multi-page readahead stalls on zRAM swap lookups and normalise VFS
  # cache pressure so reclaim drops dentries/inodes before thrashing anon pages.
  - content: |
      # Managed by stay-go.
      # Keep swappiness high for zram (CachyOS default is fine),
      # but adjust page-cluster to minimize multi-page read-ahead stalls on swap
      vm.page-cluster = 0

      # Encourage reclaiming cached dentries/inodes instead of thrashing anonymous pages
      vm.vfs_cache_pressure = 100

      # No watermark boosting. CachyOS ships 15000, which makes kswapd reclaim
      # (swap out) on every fragmentation event even with gigabytes free; with
      # zram full that spills to the dm-crypt swapfile and stalls the UI on I/O.
      vm.watermark_boost_factor = 0
    target: /etc/sysctl.d/99-zram-tuning.conf
    sudo: true

  # THP `always` (CachyOS default) shreds the free lists into sub-2M pieces on a
  # long-uptime desktop full of Electron/browser processes: 540k+ THP fault
  # fallbacks and constant compaction stalls. madvise keeps huge pages for the
  # apps that ask for them. sysfs is not a sysctl, so tmpfiles writes it at boot.
  - content: |
      # Managed by stay-go.
      w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
    target: /etc/tmpfiles.d/thp-madvise.conf
    sudo: true

  # The ACPI UCSI typec modules flap with -110 timeouts on this board and wedge
  # the Embedded Controller; blacklisting both stops the stall.
  - content: |
      # Managed by stay-go.
      blacklist ucsi_acpi
      blacklist typec_ucsi
    target: /etc/modprobe.d/blacklist-ucsi.conf
    sudo: true

  # Electron/Chromium apps go native Wayland instead of XWayland, whose damage
  # rect mismatches drive the atomic update drops.
  - content: |
      # Managed by stay-go.
      ELECTRON_OZONE_PLATFORM_HINT=auto
    target: /etc/environment.d/95-electron-wayland.conf
    sudo: true

  # Mesa's rusticl is the OpenCL driver for Intel here; it stays off unless a
  # driver is named.
  - content: |
      # Managed by stay-go.
      RUSTICL_ENABLE=iris
    target: /etc/environment.d/30-opencl.conf
    sudo: true
    depends:
      - packages: [opencl-mesa]

  # ── LG Gram (16T90SP) thermal envelope ──
  # The chassis sheds roughly 18 W over one heatpipe and a single blower.
  # Stock firmware asks for 35 W PL1 / 43 W PL2 with the passive trip at 100 C,
  # so the die reaches PROCHOT within seconds of any multi-threaded load and then
  # oscillates down into 400-800 MHz valleys. lg-gram-thermals forces the fan
  # active, caps turbo at ~2.4 GHz, holds EPP at balance_performance and caps
  # PL1/PL2 at 18 W/24 W; the script header carries the measurement behind each number.
  #
  # It also pins power-profiles-daemon to `balanced`. The AC/battery switcher
  # that used to live here set `performance` on AC, and PPD implements that
  # profile on this box by writing EPP=performance to every core — precisely the
  # setting that pinned the package at PROCHOT. See retire-power-profile-auto.
  - source: ${config_root}/files/lg-gram-thermals.sh
    target: /usr/local/bin/lg-gram-thermals
    sudo: true
    mode: "+x"

  # A tmpfiles.d drop-in cannot own these knobs: systemd-tmpfiles-setup races the
  # udev autoload of lg_laptop and intel_rapl_msr (on this box all three landed
  # inside the same second), so fan_mode and the RAPL constraints may not exist
  # yet when it runs. A oneshot ordered after the modules — and re-run from the
  # sleep targets, since the EC resets fan_mode on every resume — is deterministic.
  #
  # It is wanted by graphical.target, not multi-user.target: PPD 0.30 orders
  # itself After=multi-user.target, and a target is implicitly After= what it
  # wants, so multi-user.target -> lg-gram-thermals -> PPD -> multi-user.target
  # was a cycle, and systemd broke it on every boot by deleting this job. The
  # envelope only ever landed after a resume. See reenable-lg-gram-thermals.
  - content: |
      [Unit]
      Description=LG gram thermal envelope: fan, turbo, EPP and RAPL limits (managed by stay-go)
      Wants=power-profiles-daemon.service
      After=systemd-modules-load.service power-profiles-daemon.service
      After=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/lg-gram-thermals

      [Install]
      WantedBy=graphical.target suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target
    target: /etc/systemd/system/lg-gram-thermals.service
    sudo: true
    depends:
      - files: [/usr/local/bin/lg-gram-thermals]

  # ── LG Gram (16T90SP) keyboard backlight ──
  # The lg_laptop driver's /sys/class/leds/kbd_backlight changes nothing on this
  # firmware. The ACPI WMI method \_SB.MAP1.WMAB (sub-function 0x0400) drives the
  # backlight through the Embedded Controller, reached through acpi_call. The
  # firmware's names for its values are wrong for this keyboard: 0xA4 ("off")
  # and 0xA2 ("low") light it at full brightness and 0x80 ("high") turns it
  # off. The EC keeps whatever it was sent, with no idle timeout, so a oneshot
  # at boot and resume is enough (files/lg-kbd-backlight.sh has the details).
  # huawei_wmi matches one of LG's WMI GUIDs (59142400-...) and grabs the hotkey
  # device, so it is kept out.
  - content: |
      # Managed by stay-go. huawei_wmi binds LG's WMI GUID and fights lg_laptop.
      blacklist huawei_wmi
    target: /etc/modprobe.d/blacklist-huawei.conf
    sudo: true

  - content: |
      # Managed by stay-go. Exposes /proc/acpi/call for lg-kbd-backlight.
      acpi_call
    target: /etc/modules-load.d/acpi_call.conf
    sudo: true
    depends:
      - packages: [acpi_call-dkms]

  # /proc ignores udev, so the non-root write bit comes from tmpfiles. tmpfiles
  # setup is not ordered after modules-load, so the service below re-applies
  # the mode once the module is guaranteed to be there.
  - content: |
      # Managed by stay-go. Lets the niri bind toggle the backlight without root.
      z /proc/acpi/call 0666 root root -
    target: /etc/tmpfiles.d/acpi-call.conf
    sudo: true

  - source: ${config_root}/files/lg-kbd-backlight.sh
    target: /usr/local/bin/lg-kbd-backlight
    sudo: true
    mode: "+x"

  # Switch the backlight on at boot and again after every resume, in case the
  # EC comes back from sleep with it off. Not RemainAfterExit, so the sleep
  # targets can start it again (same pattern as lg-gram-thermals).
  - content: |
      [Unit]
      Description=LG Gram keyboard backlight on at boot and resume (managed by stay-go)
      After=systemd-modules-load.service
      After=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target

      [Service]
      Type=oneshot
      ExecStartPre=-/usr/bin/modprobe acpi_call
      ExecStartPre=/usr/bin/chmod 0666 /proc/acpi/call
      ExecStart=/usr/local/bin/lg-kbd-backlight on

      [Install]
      WantedBy=multi-user.target suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target
    target: /etc/systemd/system/lg-kbd-backlight.service
    sudo: true
    depends:
      - files: [/usr/local/bin/lg-kbd-backlight]
      - packages: [acpi_call-dkms]

  # ── Intel AX211 Bluetooth: no USB autosuspend ──
  # btusb is built into this kernel with enable_autosuspend=Y, so the
  # controller (8087:0033, USB 3-10) idles between packets. With the Poly
  # headset in a call that shows up as "SCO packet for unknown connection
  # handle", call audio failing until the headset is power-cycled, and
  # occasional "Hardware error 0x0c" chip crashes. Pinning it awake is the usual
  # fix; the watchdog in the user layer recovers whatever still slips through.
  - content: |
      # Managed by stay-go. Keep the Intel Bluetooth controller out of USB autosuspend.
      ACTION=="add|bind", SUBSYSTEM=="usb", ATTR{idVendor}=="8087", ATTR{idProduct}=="0033", TEST=="power/control", ATTR{power/control}="on"
    target: /etc/udev/rules.d/50-intel-bt-no-autosuspend.rules
    sudo: true

services:
  # The speaker fix. It was enabled by hand, never by stay-go.
  - service: necessary-verbs
    depends:
      - packages: [alsa-tools]
      - files: [/etc/systemd/system/necessary-verbs.service]

  # Enable + start the oneshot: applies the envelope now, at boot and on resume.
  - service: lg-gram-thermals
    depends:
      - packages: [power-profiles-daemon]
      - files: [/etc/systemd/system/lg-gram-thermals.service]

  # Enable + start the oneshot: lights the keyboard now, at boot and on resume.
  - service: lg-kbd-backlight
    depends:
      - packages: [acpi_call-dkms]
      - files: [/etc/systemd/system/lg-kbd-backlight.service]

commands:
  # ── Hide the "Scratch" workspace from the DMS bar ──
  # Scratch is the parking slot for the hidden dropdown terminal (see
  # files/niri/rules.kdl). DMS has no setting to hide a workspace: its niri
  # filter only knows "active" or "holds a window", and Scratch always holds the
  # parked terminal, so it always renders. The patch inserts one line into a
  # package-owned .qml; the pacman hook above re-applies it after a dms-shell
  # upgrade reverts it. Safe to run repeatedly — it no-ops when already applied.
  # Takes effect on `systemctl --user restart dms` (DMS_DISABLE_HOT_RELOAD=1).
  # No depends: `packages: [dms-shell]` never resolves (dms-shell isn't managed
  # here), and `files:` is a plan-time skip condition, so it would skip on the
  # first run — before the very file it names has been written. Files execute
  # ahead of commands anyway, and the script no-ops if the .qml isn't there.
  - name: dms-hide-scratch-workspace
    command: /usr/local/bin/dms-hide-scratch-workspace.sh
    sudo: true

  # ── Kernel boot parameter: i915.enable_psr=0 ──
  # Panel Self Refresh on this i915 panel drops atomic display updates. The flag
  # has to be merged into the existing KERNEL_CMDLINE[default] line in
  # /etc/default/limine rather than shipped as a drop-in: nothing in
  # limine-mkinitcpio-hook parses KERNEL_CMDLINE out of /etc/limine-entry-tool.d,
  # and /etc/default/limine is loaded last anyway. The line also carries this
  # machine's LUKS UUID and rootflags, so stay-go edits it in place instead of
  # owning the whole file. Both the command and the rollback are idempotent, and
  # limine-update regenerates /boot/limine.conf from it.
  - name: limine-i915-psr
    command: |
      grep -q 'i915\.enable_psr=0' /etc/default/limine || \
        sed -i 's/^\(KERNEL_CMDLINE\[default\]+=".*\)"$/\1 i915.enable_psr=0"/' /etc/default/limine
      grep -q 'i915\.enable_psr=0' /etc/default/limine
      limine-update
    rollback: |
      sed -i 's/ i915\.enable_psr=0//g' /etc/default/limine
      limine-update
    sudo: true
    depends:
      - files: [/etc/default/limine]

  # Apply the Bluetooth autosuspend rule now; udev only runs it on the next
  # add/bind (boot or a chip reset). Writing power/control directly needs no
  # replug, so a headset call in progress is not interrupted. Backticks, not
  # $(...): stay-go expands $(...) at load time even in command strings.
  - name: intel-bt-no-autosuspend
    command: |
      udevadm control --reload-rules
      for d in /sys/bus/usb/devices/*; do
        [ "`cat $d/idVendor 2>/dev/null`:`cat $d/idProduct 2>/dev/null`" = 8087:0033 ] && echo on > $d/power/control
      done
      true
    check: |
      for d in /sys/bus/usb/devices/*; do
        [ "`cat $d/idVendor 2>/dev/null`:`cat $d/idProduct 2>/dev/null`" = 8087:0033 ] || continue
        [ "`cat $d/power/control`" = on ] || { echo "Intel Bluetooth USB autosuspend is on"; exit 1; }
      done
    sudo: true

  # ── Applying the drop-ins above ──
  # A command re-runs only when its own text changes, never when the file it
  # applies changes, so each one carries a check: that compares the live system
  # (or a copy taken when it last ran) against the file. None has a files:
  # guard: that is a plan-time condition, so on a fresh machine it would skip
  # before the file was written. Files with no depends run ahead of commands.
  # Stamps live in /var/lib/stay-go/applied, readable by the unprivileged check.

  # Apply the sysctl drop-in now so a reboot is not required.
  - name: reload-sysctl-zram-tuning
    command: sysctl --system
    check: |
      sysctl -n vm.page-cluster | grep -qx 0 && sysctl -n vm.vfs_cache_pressure | grep -qx 100 \
        && sysctl -n vm.watermark_boost_factor | grep -qx 0 \
        || { echo "live vm.* sysctls differ from 99-zram-tuning.conf"; exit 1; }
    sudo: true

  # Apply the THP drop-in now so a reboot is not required.
  - name: apply-thp-madvise
    command: systemd-tmpfiles --create /etc/tmpfiles.d/thp-madvise.conf
    check: |
      grep -q '\[madvise\]' /sys/kernel/mm/transparent_hugepage/enabled \
        || { echo "THP is not madvise: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"; exit 1; }
    sudo: true

  # The UCSI blacklist lives in the initramfs, so it needs a rebuild to take
  # effect. The stamp is the blacklist as of the last rebuild; an edit re-runs it.
  # limine-mkinitcpio, not mkinitcpio -P: this box has no /etc/mkinitcpio.d
  # presets (limine-mkinitcpio-hook builds the images itself), and the
  # /usr/local/bin/mkinitcpio wrapper answers -P with an interactive prompt.
  - name: rebuild-initramfs-ucsi-blacklist
    command: |
      limine-mkinitcpio
      install -Dm644 /etc/modprobe.d/blacklist-ucsi.conf /var/lib/stay-go/applied/blacklist-ucsi.conf
    check: |
      cmp -s /etc/modprobe.d/blacklist-ucsi.conf /var/lib/stay-go/applied/blacklist-ucsi.conf \
        || { echo "blacklist-ucsi.conf changed since the last initramfs rebuild"; exit 1; }
    sudo: true

  # The blacklist only stops future autoloads; drop huawei_wmi now if this boot
  # already loaded it, so lg_laptop owns the WMI device without a reboot.
  - name: unload-huawei-wmi
    command: '! grep -q "^huawei_wmi " /proc/modules || modprobe -r huawei_wmi'
    check: '! grep -q "^huawei_wmi " /proc/modules || { echo "huawei_wmi is loaded"; exit 1; }'
    sudo: true

  # keyd reads /etc/keyd/default.conf only at start; reload it after an edit.
  - name: keyd-reload
    command: |
      keyd reload
      install -Dm644 /etc/keyd/default.conf /var/lib/stay-go/applied/keyd-default.conf
    check: |
      cmp -s /etc/keyd/default.conf /var/lib/stay-go/applied/keyd-default.conf \
        || { echo "keyd config changed since the last reload"; exit 1; }
    sudo: true
    depends:
      - packages: [keyd]
      - services: [keyd]

  # The speaker unit used to sit failed (start-limit-hit, see its file entry).
  # Pick up the oneshot unit, clear the failure and apply the verbs now. The
  # services entry above plans TRACK because the unit is already enabled, so
  # nothing else would reload it before the next boot.
  - name: necessary-verbs-recover
    command: |
      systemctl daemon-reload
      systemctl reset-failed necessary-verbs.service 2>/dev/null || true
      systemctl restart necessary-verbs.service
    check: '! systemctl is-failed --quiet necessary-verbs.service || { echo "necessary-verbs.service has failed"; exit 1; }'
    sudo: true
    depends:
      - packages: [alsa-tools]

  # Retire what the hand-run setup scripts left behind (a state-file based
  # lg-kbd-keepalive service, its shell/python daemons and lg-kbd-toggle);
  # lg-kbd-backlight.service replaces the lot. No-op once they are gone.
  # The deploy script was re-run by hand on 2026-09-06, a day after this first
  # ran, and both daemons ran side by side until the reset-failed line was
  # added, which changes the hash so stay-go runs this again.
  - name: retire-manual-lg-kbd-keepalive
    command: |
      systemctl disable --now lg-kbd-keepalive.service 2>/dev/null || true
      rm -f /etc/systemd/system/lg-kbd-keepalive.service \
            /usr/local/bin/lg-kbd-keepalive /usr/local/bin/lg-kbd-daemon.py \
            /usr/local/bin/lg-kbd-toggle /tmp/.lg_kbd_state
      systemctl daemon-reload
      systemctl reset-failed lg-kbd-keepalive.service 2>/dev/null || true
    sudo: true

  # Retire lg-kbd-daemon. It re-sent the "high" value every 3s to beat an EC
  # idle timeout that does not exist, and on this keyboard "high" is dark, so it
  # held the backlight off. A file REMOVE only drops state, so the binary and
  # its level file are deleted here. No-op once they are gone.
  - name: retire-lg-kbd-daemon
    command: rm -f /usr/local/bin/lg-kbd-daemon /run/lg-kbd-backlight
    sudo: true

  # Retire the AC/battery power-profile switcher. PPD's `performance` profile is
  # implemented on this box purely as EPP=performance on every core, so setting
  # it on AC undid the thermal envelope on every boot and every plug event;
  # the machine now sits on `balanced` full time, which is the same EPP the
  # envelope wants. stay-go disables the unit through the services resource, but
  # a file REMOVE only drops state — the unit, script and udev rule are cleared
  # here. No-op once they are gone.
  - name: retire-power-profile-auto
    command: |
      systemctl disable --now power-profile-auto.service 2>/dev/null || true
      rm -f /etc/systemd/system/power-profile-auto.service \
            /usr/local/bin/power-profile-auto.sh \
            /etc/udev/rules.d/99-power-profile.rules
      systemctl daemon-reload
      udevadm control --reload-rules
    sudo: true

  # Retire the hand-run tmpfiles.d + resume-unit version of the thermal fix.
  # systemd-tmpfiles-setup races the udev autoload of lg_laptop and
  # intel_rapl_msr, so its fan_mode and RAPL writes could land on paths that do
  # not exist yet; lg-gram-thermals.service waits for the nodes instead and
  # covers boot and resume from one unit. No-op once they are gone.
  - name: retire-manual-lg-gram-tmpfiles
    command: |
      systemctl disable --now lg-gram-resume.service 2>/dev/null || true
      rm -f /etc/systemd/system/lg-gram-resume.service \
            /etc/tmpfiles.d/lg-gram-thermals.conf
      systemctl daemon-reload
    sudo: true

  # Move lg-gram-thermals.service from multi-user.target.wants to
  # graphical.target.wants. Its unit file changed WantedBy= to break a boot
  # ordering cycle with power-profiles-daemon, but a services UPDATE is only
  # daemon-reload + restart; `enable` never removes the old symlink, so the
  # cycle would survive. Then start it, so the envelope lands without a reboot.
  #
  # Must not depend on running after the unit file is written: a commands
  # `files:` dep is only a skip condition, and the unit file (which depends on
  # the script) sorts behind every command — `systemctl reenable` here once read
  # the old [Install] and recreated the multi-user link. So the link is moved by
  # hand. On a fresh machine the unit is absent at this point and the services
  # ADD (`enable --now`, reading the new [Install]) does the linking instead.
  # Idempotent.
  - name: reenable-lg-gram-thermals
    command: |
      rm -f /etc/systemd/system/multi-user.target.wants/lg-gram-thermals.service
      systemctl daemon-reload
      if [ -e /etc/systemd/system/lg-gram-thermals.service ]; then
        systemctl add-wants graphical.target lg-gram-thermals.service
        systemctl start lg-gram-thermals.service
      fi
    sudo: true

backups: !include "./cachygram/backups.yaml"
