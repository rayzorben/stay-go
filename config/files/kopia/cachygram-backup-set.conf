# What cachygram backs up to orohost (managed by stay-go —
# config/hosts/cachygram/backups.yaml). Read by /usr/local/bin/kopia-backup.
#
# One entry per line; blank lines and # comments are ignored.
#
#   path <folder> [ignore <pattern>]...
#       Back up this folder. A folder that does not exist is skipped.
#
#   find <root> <name> [prune <glob>]...
#       Back up every folder called <name> under <root> (same filesystem only),
#       each as its own source. Folders matching a prune glob are not searched.
#
# SQLite databases (*.db, *.sqlite, *.sqlite3) inside a folder are copied with
# sqlite3 .backup before the snapshot, so a database that is being written to
# is never caught half-written. ignore patterns are rsync --exclude patterns.

# Claude Code's state, wherever it lives: ~/.claude, each distrobox home's
# .claude, project-level .claude folders. Dropbox already syncs the projects
# inside it; the rest of the prunes are caches whose .claude folders ship with
# an extension or module, not with anything of yours.
find /home .claude prune /home/*/Dropbox prune */.cache prune */.local/share/Trash prune */.local/share/Steam prune */.vscode/extensions prune */.cursor/extensions prune */go/pkg/mod prune */node_modules prune */.config/Claude
find /root .claude

# Life's data (stores, secrets, tracked files' versions). Same excludes as
# Life's own tools/backup.sh: scratch copies and rebuilt Claude context.
path /home/rayben/.local/share/life ignore *.tmp ignore claude/ctx-*

# The local mail app's database and Gmail token.
path /home/rayben/.local/share/mail

# GNOME keyring: SSH key passphrases, the stay-go secrets password, app tokens.
path /home/rayben/.local/share/keyrings

# Saved Wi-Fi networks and VPN profiles.
path /etc/NetworkManager/system-connections

# Azure file-share credentials for the CIFS mounts in /etc/fstab.
path /etc/smbcredentials
