<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Map generic names to the Windows fonts instead of the metric-compatible
     free fonts from 30-metric-aliases.conf and the URW 69-urw-*.conf rules.
     Must sort after them: an <accept> inserts right after the matched family,
     so the later rule wins. -->
<fontconfig>
  <alias binding="same">
    <family>Helvetica</family>
    <accept>
      <family>Arial</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <accept>
      <family>Times New Roman</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Courier</family>
    <accept>
      <family>Courier New</family>
    </accept>
  </alias>
</fontconfig>
