variables:
  dropbox_folder: ~/Dropbox
  lucida_font: ${dropbox_folder}/Ray/Configuration/Fonts/LucidaProgrammerNerdFontMono-Regular.ttf
  lucida_font_destination: /usr/share/fonts/TTF/LucidaProgrammerNerdFontMono-Regular.ttf

packages:
  - neovim
  - git
  - docker
  - dropbox

groups:
  - wheel
  - docker

users:
  - username: rayben
    name: Ray Bennett
    shell: /bin/fish
    groups: ['wheel', 'docker']

services:
  - service: docker
    depends:
      - packages: ['docker']

commands:
  - name: Lucida Font
    sudo: true
    command: |
      cp ${lucida_font} ${lucida_font_destination}
      fc-cache -f
    depends:
      - packages: [dropbox]
      - files: ["${lucida_font}"]
    rollback: |
      rm ${lucida_font_destination}
  - name: echo ssh
    command: |
      echo ${secrets.ssh_id_ed25519} > ~/ssh_test.key

secrets:
  ssh_id_ed25519: !encrypted 
  _verify: !encrypted sn+HxIuQgQPiWUqaJZkumrQQWr+18XTZyAd6+9kYPLKj/ETTZ2X/RGw5CtUBPuFz4bBQqY8hTC7CJlWfzj8=
