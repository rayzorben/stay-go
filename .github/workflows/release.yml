# Publishes a GitHub release when a version tag is pushed.
# Tags follow the binary's version scheme: vYYYYMMDD.nn (e.g. v20261009.00).
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Test
      run: go test ./...

    - name: Build
      env:
        CGO_ENABLED: "0"
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        for ARCH in amd64 arm64; do
          NAME="stay-go_${VERSION}_linux_${ARCH}"
          GOOS=linux GOARCH="$ARCH" go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${NAME}/stay-go" ./cmd/stay-go
          cp README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
        done
        (cd dist && sha256sum *.tar.gz > SHA256SUMS)

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "stay-go ${GITHUB_REF_NAME}" \
          --generate-notes \
          dist/*.tar.gz dist/SHA256SUMS
